<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a Cut</title>
<style>
:root{
  --bg:#f6f2ec; --card:#fff; --ink:#1b1b1f; --muted:#76706a; --line:#e6dfd5;
  --accent:#b4462b; --accent-ink:#fff; --soft:#f3e4dd; --ok:#2e7d4f;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#d9d3ca;color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
header{padding:14px 16px 10px;display:flex;align-items:center;gap:8px}
.back{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);font-size:20px;cursor:pointer;visibility:hidden}
.back.on{visibility:visible}
header h1{font-size:18px;flex:1;text-align:center;padding-right:40px}
.steps{display:flex;gap:6px;padding:0 16px 12px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.done{background:var(--accent)}
main{flex:1;overflow-y:auto;padding:4px 16px 120px}
h2{font-size:22px;margin:6px 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.opt{width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;font:inherit;color:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.ico{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:22px;flex:none}
.opt .t{flex:1}
.opt b{display:block;font-size:16px}
.opt small{color:var(--muted);font-size:13px}
.price{font-weight:700}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none}
.star{color:#c98a00;font-size:13px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.day{flex:none;width:58px;padding:10px 0;border-radius:14px;border:2px solid transparent;background:var(--card);text-align:center;font:inherit;color:inherit;cursor:pointer}
.day span{display:block;font-size:12px;color:var(--muted)}
.day b{font-size:18px}
.day[aria-pressed=true]{background:var(--accent);color:#fff}
.day[aria-pressed=true] span{color:#fbe3da}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:13px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);font:inherit;font-weight:600;cursor:pointer;color:inherit}
.slot[aria-pressed=true]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.slot:disabled{color:#b9b3aa;background:transparent;text-decoration:line-through;cursor:not-allowed}
.label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 8px}
.sum{background:var(--card);border-radius:16px;padding:6px 16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border:0}
.row span{color:var(--muted)}
.row b{text-align:right}
.note{font-size:13px;color:var(--muted);margin-top:12px;text-align:center}
footer{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.cta{width:100%;height:54px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.cta:disabled{background:#cfc8bd;cursor:not-allowed}
button:focus-visible{outline:3px solid #1b6ef3;outline-offset:2px}
.done{text-align:center;padding-top:40px}
.check{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:44px;display:grid;place-items:center;margin:0 auto 18px}
.done .sum{text-align:left;margin-top:22px}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" id="back" aria-label="Back">&#8592;</button>
    <h1 id="title">Choose service</h1>
  </header>
  <div class="steps" id="steps"><i></i><i></i><i></i><i></i></div>
  <main id="main"></main>
  <footer><button class="cta" id="cta" disabled>Continue</button></footer>
</div>

<script>
const services=[
 {id:'cut',n:'Classic Haircut',d:'Cut, wash & style',m:30,p:28,i:'✂️'},
 {id:'fade',n:'Skin Fade',d:'Precision fade & line-up',m:45,p:35,i:'💈'},
 {id:'beard',n:'Beard Trim',d:'Shape, hot towel, oil',m:20,p:18,i:'🧔'},
 {id:'combo',n:'Cut + Beard',d:'The full works',m:60,p:50,i:'⭐'},
 {id:'shave',n:'Hot Towel Shave',d:'Straight razor shave',m:30,p:30,i:'🪒'}
];
const barbers=[
 {id:'any',n:'Any available',d:'Fastest booking',c:'#76706a',r:''},
 {id:'marco',n:'Marco Reyes',d:'Fades & designs',c:'#b4462b',r:'4.9'},
 {id:'dev',n:'Dev Patel',d:'Beards & classic cuts',c:'#2b5f8a',r:'4.8'},
 {id:'jay',n:'Jay Okafor',d:'Textured & long hair',c:'#4c7a4a',r:'4.7'}
];
const times=['09:00','09:30','10:00','10:30','11:00','11:30','12:00','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00'];
const titles=['Choose service','Choose barber','Pick a time','Confirm booking'];
const S={step:0,service:null,barber:null,day:0,time:null,done:false};
const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d});
const $=id=>document.getElementById(id);
const fmtDay=d=>d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
const svc=()=>services.find(x=>x.id===S.service), bar=()=>barbers.find(x=>x.id===S.barber);
// deterministic pseudo-availability
function taken(i,t){const s=(days[i].getDate()*7+times.indexOf(t)*13+(S.barber||'').length*5)%5;return s===0||(i===0&&times.indexOf(t)<3)}

function render(){
  const m=$('main');
  [...$('steps').children].forEach((e,i)=>e.className=i<=S.step?'done':'');
  $('title').textContent=S.done?'Booked':titles[S.step];
  $('back').classList.toggle('on',S.step>0&&!S.done);
  let h='';
  if(S.done){
    $('steps').style.display='none';$('cta').textContent='Done';$('cta').disabled=false;
    h=`<div class="done"><div class="check">✓</div><h2>You're booked!</h2><p class="sub">We'll send a reminder 2 hours before.</p>${summary()}</div>`;
  } else if(S.step===0){
    h=`<h2>What are you in for?</h2><p class="sub">Pick one service.</p>`+services.map(s=>`<button class="opt" data-k="service" data-v="${s.id}" aria-pressed="${S.service===s.id}"><div class="ico">${s.i}</div><div class="t"><b>${s.n}</b><small>${s.d} · ${s.m} min</small></div><span class="price">$${s.p}</span></button>`).join('');
  } else if(S.step===1){
    h=`<h2>Who's cutting?</h2><p class="sub">Choose your barber.</p>`+barbers.map(b=>`<button class="opt" data-k="barber" data-v="${b.id}" aria-pressed="${S.barber===b.id}"><div class="av" style="background:${b.c}">${b.id==='any'?'★':b.n[0]}</div><div class="t"><b>${b.n}</b><small>${b.d}</small></div>${b.r?`<span class="star">★ ${b.r}</span>`:''}</button>`).join('');
  } else if(S.step===2){
    h=`<h2>When works?</h2><p class="sub">${svc().n} · ${svc().m} min with ${bar().n}</p><div class="days">`+days.map((d,i)=>`<button class="day" data-k="day" data-v="${i}" aria-pressed="${S.day===i}"><span>${i===0?'Today':d.toLocaleDateString('en-US',{weekday:'short'})}</span><b>${d.getDate()}</b></button>`).join('')+`</div><div class="label">Available times</div><div class="slots">`+times.map(t=>`<button class="slot" data-k="time" data-v="${t}" aria-pressed="${S.time===t}" ${taken(S.day,t)?'disabled':''}>${t}</button>`).join('')+`</div>`;
  } else {
    h=`<h2>Review &amp; confirm</h2><p class="sub">Check the details below.</p>${summary()}<p class="note">Free cancellation up to 2 hours before. Pay at the shop.</p>`;
  }
  m.innerHTML=h;
  if(!S.done){
    $('cta').textContent=S.step===3?`Confirm booking · $${svc().p}`:'Continue';
    $('cta').disabled=!(S.step===0?S.service:S.step===1?S.barber:S.step===2?S.time:true);
  }
}
function summary(){
  const s=svc(),b=bar();
  return `<div class="sum"><div class="row"><span>Service</span><b>${s.n}</b></div><div class="row"><span>Barber</span><b>${b.n}</b></div><div class="row"><span>Date</span><b>${fmtDay(days[S.day])}</b></div><div class="row"><span>Time</span><b>${S.time} (${s.m} min)</b></div><div class="row"><span>Total</span><b>$${s.p}</b></div></div>`;
}
$('main').addEventListener('click',e=>{
  const b=e.target.closest('[data-k]');if(!b||b.disabled)return;
  const k=b.dataset.k,v=b.dataset.v;
  if(k==='day'){S.day=+v;S.time=null}else S[k]=v;
  const y=$('main').scrollTop;render();$('main').scrollTop=y;
});
$('cta').onclick=()=>{
  if(S.done){Object.assign(S,{step:0,service:null,barber:null,day:0,time:null,done:false});$('steps').style.display='';render();return}
  if(S.step<3){S.step++;$('main').scrollTop=0;render()}else{S.done=true;render()}
};
$('back').onclick=()=>{if(S.step>0){S.step--;render()}};
render();
</script>
</body>
</html>
