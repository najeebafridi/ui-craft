<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Forge Deck</title>
<!-- Forge Deck: main window (Electron renderer). One file + theme.css (palette.mjs output, accent #27C9E8).
     Fonts load from Google Fonts (SIL OFL); in the packaged app bundle them. Falls back to system fonts offline.
     Brief:
       Product: monitor for 6 3D printers in a small print shop (Electron, desk + wall monitor)
       User and feeling: operator at a desk all day who must catch a failed print in seconds; owner on a wall monitor who wants a cockpit -> exact, alert, in command
       Direction: Graph-paper technical x Quiet instrument, dark; accent cyan #27C9E8, amber = attention, red = failed
       Type: Barlow Condensed (numbers, names), Geist (UI), JetBrains Mono (readouts); 14px body, tabular numbers
       Shape and depth: 2-4px radius, hairlines, bracket corners; glow only as a state signal (failed bay)
       Genre traits (5): bracket-cornered panels, segmented progress ruler, mono readouts with tracked caps labels, signal colours with fixed meaning, hairline structure
       Level: desk mode = 1 (no canvas, idle at zero); display mode = 2 (one signature moment)
       Signature moment: in display mode a scan beam sweeps across the six bays, powering each one up; if a print has failed, the camera then glides to that bay and its alarm light pulses 4 times, then rests
       Text lane: all words sit in HTML tiles under the scene, one column per bay; nothing is written over the 3D
       Reduced motion: still frame, no sweep, steady alarm glow.  No GPU: the same six bays drawn flat in SVG from the same data
       Primary task: see which printer needs a human, then queue the next job -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
@property --p { syntax: "<number>"; inherits: true; initial-value: 0; }
:root, :root[data-theme] {
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-sans: "Geist", system-ui, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, "Cascadia Mono", monospace;
  --radius-sm: 2px; --radius: 3px; --radius-lg: 4px;
  --dur-fast: 100ms; --dur-base: 160ms; --dur-slow: 240ms;
  --immersive: 2;
  --text-body: 14px;
  --control-h: 32px;
  --titlebar-h: 40px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--bg); color: var(--text);
  font: 400 var(--text-body)/1.5 var(--font-sans);
  -webkit-font-smoothing: antialiased; font-optical-sizing: auto;
  display: grid; grid-template-rows: var(--titlebar-h) auto minmax(0, 1fr);
  user-select: none; -webkit-user-select: none;
  /* hairline graph paper under everything: 4% contrast */
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  --grid: color-mix(in oklab, var(--text) 4%, transparent);
}
h1, h2 { text-wrap: balance; }
h1, h2, h3, p, dl, dd, ol, ul { margin: 0; padding: 0; }
ol, ul { list-style: none; }
button, select, input { font: inherit; color: inherit; }
button { cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -48px; z-index: 50; padding: 8px 12px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-overlay); }
.skip:focus { top: 8px; }
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.i-fill { fill: currentColor; stroke: none; }

/* signal colours: fixed meaning everywhere. --c = fills and lines, --ct = text that passes 4.5:1 */
[data-state="printing"] { --c: var(--accent);  --ct: var(--accent-text); }
[data-state="warning"]  { --c: var(--warning); --ct: var(--warning-text); }
[data-state="heating"]  { --c: var(--info);    --ct: var(--info-text); }
[data-state="paused"]   { --c: var(--info);    --ct: var(--info-text); }
[data-state="failed"]   { --c: var(--danger);  --ct: var(--danger-text); }
[data-state="done"]     { --c: var(--success); --ct: var(--success-text); }
[data-state="idle"]     { --c: var(--border-strong); --ct: var(--text-muted); }

/* ---------- title bar (custom frame: native window buttons keep their place via titleBarOverlay) ---------- */
.titlebar {
  display: flex; align-items: center; gap: 16px; padding: 0 calc(100vw - env(titlebar-area-width, 100vw) + 12px) 0 16px;
  background: color-mix(in oklab, var(--surface) 88%, transparent); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); -webkit-app-region: drag; app-region: drag;
}
.titlebar button, .titlebar .badge, .titlebar kbd { -webkit-app-region: no-drag; app-region: no-drag; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand svg { width: 20px; height: 20px; color: var(--accent); }
.brand h1 { font: 600 18px/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; }
.crumb { color: var(--text-muted); font: 400 12px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
.sp { flex: 1; }
.badge { font: 500 12px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--warning-text); border: 1px solid color-mix(in oklab, var(--warning) 55%, transparent); padding: 4px 8px; border-radius: var(--radius-sm); }
.clock { font: 500 14px var(--font-mono); color: var(--text-muted); }
kbd { font: 500 12px/1 var(--font-mono); padding: 3px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: var(--radius-sm); color: var(--text-muted); background: var(--surface-2); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--control-h); padding: 0 12px;
  border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--text);
  font: 500 14px var(--font-sans); white-space: nowrap;
  transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.btn:active:not(:disabled) { transform: scale(var(--press-scale)); }
.btn:disabled { opacity: .5; }
@media (hover: hover) { .btn:hover:not(:disabled) { background: var(--surface-3); } }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); box-shadow: var(--shadow-button); font-weight: 600; }
@media (hover: hover) { .btn-primary:hover:not(:disabled) { background: var(--accent-hover); } }
.btn-danger { border-color: var(--danger); color: var(--danger-text); }
.btn-danger[data-armed="true"] { background: var(--danger); color: #fff; }
@media (hover: hover) { .btn-danger[data-armed="true"]:hover:not(:disabled) { background: var(--danger); } }
.btn-sm { height: 28px; padding: 0 8px; font-size: 12px; }
.btn-icon { width: 28px; padding: 0; height: 28px; border-color: transparent; background: transparent; color: var(--text-muted); }
@media (hover: hover) { .btn-icon:hover:not(:disabled) { background: var(--surface-3); color: var(--text); } }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-text); }

/* ---------- status strip ---------- */
.strip { display: flex; align-items: stretch; gap: 0; padding: 0 16px; border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--bg) 70%, transparent); }
.stat { display: flex; align-items: baseline; gap: 8px; padding: 8px 24px 8px 0; margin-right: 24px; border-right: 1px solid var(--border); }
.stat:last-child { border-right: 0; }
.stat .k { font: 400 12px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); display: inline-flex; align-items: center; gap: 4px; align-self: center; }
.stat .v { font: 600 24px/1 var(--font-display); letter-spacing: 0.01em; }
.stat .u { font: 400 12px var(--font-mono); color: var(--text-muted); }
.stat[data-state] .k { color: var(--ct); }
.stat[data-zero="true"] .v { color: var(--text-subtle); }
.stat.attn:not([data-zero="true"]) .v { color: var(--ct); }

/* ---------- desk layout ---------- */
#desk { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px; min-height: 0; }
.floor { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.alerts { display: grid; gap: 4px; }
.alerts:empty { display: none; }
.alert {
  display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 4px 8px 4px 12px; border: 1px solid var(--c); border-left-width: 3px;
  border-radius: var(--radius); background: color-mix(in oklab, var(--c) 12%, var(--surface));
}
.alert > .i { color: var(--ct); width: 20px; height: 20px; }
.alert p { flex: 1; min-width: 0; font-size: 14px; }
.alert strong { font-weight: 600; }
.alert .when { color: var(--text-muted); font: 400 12px var(--font-mono); white-space: nowrap; }
.bays { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px; flex: 1; min-height: 0; }

/* ---------- a printer bay (desk) ---------- */
.bay {
  --bc: var(--c);
  position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; padding: 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  transition: border-color var(--dur-base) var(--ease-out), background-color var(--dur-base) var(--ease-out);
}
.bay::before, .bay::after { content: ""; position: absolute; width: 10px; height: 10px; border: 2px solid var(--bc); pointer-events: none; }
.bay::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.bay::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.bay[data-sel="true"] { border-color: var(--border-strong); background: var(--surface-2); }
.bay[data-state="failed"] { border-color: var(--danger); background: linear-gradient(color-mix(in oklab, var(--danger) 14%, var(--surface)), var(--surface) 75%); }
.bay[data-state="warning"] { border-color: color-mix(in oklab, var(--warning) 60%, var(--border)); }
.glow { position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; opacity: 0; box-shadow: 0 0 0 1px var(--danger), 0 0 28px -2px color-mix(in oklab, var(--danger) 55%, transparent); }
.bay[data-state="failed"] .glow, .tile[data-state="failed"] .glow { opacity: .55; animation: alarm 2s var(--ease-in-out) 4; }
@keyframes alarm { 50% { opacity: 1; } }
.bh { display: flex; align-items: center; gap: 8px; }
.bay-id { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1; padding: 0; margin: -4px; padding: 4px; border: 0; background: transparent; border-radius: var(--radius-sm); text-align: left; }
@media (hover: hover) { .bay-id:hover { background: var(--surface-3); } }
.bay-id .n { font: 500 12px var(--font-mono); color: var(--text-muted); letter-spacing: 0.06em; }
.bay-id h2 { font: 600 24px/1 var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; }
.bay-id .md { font: 400 12px var(--font-mono); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border: 1px solid color-mix(in oklab, var(--c) 70%, transparent); border-radius: var(--radius-sm); color: var(--ct); background: color-mix(in oklab, var(--c) 12%, transparent); font: 500 12px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.chip .i { width: 14px; height: 14px; }
.job { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.job .nm { font: 500 14px var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.job .mat { margin-left: auto; font: 400 12px var(--font-mono); color: var(--text-muted); white-space: nowrap; }
.prog { display: flex; align-items: center; gap: 12px; }
.pct { font: 600 36px/1 var(--font-display); letter-spacing: 0.01em; min-width: 2.3ch; text-align: right; }
.pct small { font-size: 18px; color: var(--text-muted); margin-left: 1px; }
.seg {
  --p: 0; flex: 1; height: 12px; min-width: 0;
  background: linear-gradient(90deg, var(--c) calc(var(--p) * 1%), var(--surface-3) calc(var(--p) * 1%));
  -webkit-mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 7px); mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 7px);
  transition: --p var(--dur-slow) linear;
}
.note { display: flex; align-items: flex-start; gap: 4px; min-height: 18px; font-size: 12px; line-height: 1.5; color: var(--text-muted); }
.note .i { width: 14px; height: 14px; margin-top: 2px; color: var(--ct); }
.note b { font-weight: 500; color: var(--ct); }
[data-state="failed"] .note, [data-state="warning"] .note { color: var(--text); }
.reads { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); }
.reads dt { font: 400 12px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
.reads dd { font: 500 16px/1.3 var(--font-mono); white-space: nowrap; }
.reads dd small { font-size: 12px; color: var(--text-muted); }
.trace { flex: 1; min-height: 28px; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.trace figcaption { font: 400 12px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); }
.trace svg { flex: 1; min-height: 0; width: 100%; border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); overflow: hidden; }
.trace path { fill: none; vector-effect: non-scaling-stroke; stroke-width: 1.5; }
.trace .gl { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 4; }
.trace .tn { stroke: var(--c); } .trace .tb { stroke: var(--text-subtle); }
.reads dd small { margin-left: 2px; }
.acts { display: flex; gap: 8px; }
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.side .queue { flex: 0 1 auto; min-height: 280px; }
.side .events { flex: 1 0 auto; }
.events { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.events h2 { font: 600 18px/1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
.events li { display: grid; grid-template-columns: auto 8px minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 4px 0; font-size: 12px; line-height: 1.4; }
.events .ts { font-family: var(--font-mono); color: var(--text-muted); }
.events .dot { width: 8px; height: 8px; background: var(--c); border-radius: 50%; align-self: center; }
.events .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acts:empty { display: none; }

/* ---------- queue ---------- */
.queue { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); position: relative; }
.queue::before, .queue::after { content: ""; position: absolute; width: 10px; height: 10px; border: 2px solid var(--border-strong); pointer-events: none; }
.queue::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.queue::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.qh { display: flex; align-items: baseline; gap: 8px; padding: 12px 12px 0; }
.qh h2 { font: 600 18px/1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; }
.qh span { color: var(--text-muted); font: 400 12px var(--font-mono); }
.addjob { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); align-items: end; }
.fld { display: grid; gap: 4px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld label { font: 400 12px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
select { height: var(--control-h); padding: 0 8px; width: 100%; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: var(--radius); font: 400 14px var(--font-mono); }
select:focus-visible { outline-offset: 0; }
.qlist { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 0; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.job-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 48px; padding: 4px 8px 4px 12px; border-bottom: 1px solid var(--border); }
.job-row:last-child { border-bottom: 0; }
.job-row.fresh { background: var(--accent-soft); }
.job-row .ix { font: 400 12px var(--font-mono); color: var(--text-muted); }
.job-row .t { font: 500 14px var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job-row .m { font: 400 12px var(--font-mono); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job-row .m b { font-weight: 500; color: var(--text); }
.job-row .ra { display: flex; }
.empty { padding: 24px 16px; color: var(--text-muted); }
.empty strong { display: block; color: var(--text); font-weight: 500; margin-bottom: 4px; }

/* ---------- toast ---------- */
.toasts { position: fixed; left: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 40; max-width: min(520px, calc(100vw - 32px)); }
.toast { display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 12px; background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--shadow-overlay); animation: toast-in var(--dur-base) var(--ease-out); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

/* ---------- display mode (wall monitor): read-only, large, the scene stays in its own band ---------- */
#display { display: none; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 12px; padding: 16px 24px 16px; min-height: 0; }
body[data-mode="display"] #display { display: grid; }
body[data-mode="display"] #desk { display: none; }
.dalerts { display: grid; gap: 4px; }
.dalerts:empty { display: none; }
.dalerts .alert { min-height: 56px; }
.dalerts .alert p { font-size: 24px; line-height: 1.3; }
.dalerts .alert > .i { width: 28px; height: 28px; }
.scene { position: relative; min-height: 160px; overflow: hidden; }
.scene canvas, .scene-fallback { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene canvas { opacity: 0; transition: opacity var(--dur-slow) var(--ease-out); }
.scene[data-scene="live"] canvas, .scene[data-scene="still"] canvas { opacity: 1; }
.scene[data-scene="live"] .scene-fallback, .scene[data-scene="still"] .scene-fallback { visibility: hidden; }
.scene-fallback svg { width: 100%; height: 100%; display: block; }
.scene-tools { position: absolute; right: 0; top: 0; display: flex; gap: 8px; z-index: 2; }
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.tile {
  --bc: var(--c); position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 12px 12px 12px;
  background: color-mix(in oklab, var(--surface) 92%, transparent); border: 1px solid var(--border); border-radius: var(--radius);
}
.tile::before, .tile::after { content: ""; position: absolute; width: 12px; height: 12px; border: 2px solid var(--bc); pointer-events: none; }
.tile::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.tile::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.tile[data-state="failed"] { border-color: var(--danger); background: linear-gradient(color-mix(in oklab, var(--danger) 16%, var(--surface)), var(--surface) 80%); }
.tile[data-sel="true"] { border-color: var(--border-strong); }
.tile .bh { gap: 8px; justify-content: space-between; }
.tile .bh .n { font: 500 14px var(--font-mono); color: var(--text-muted); }
.tile h2 { font: 600 28px/1 var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; }
.tile .chip { height: 28px; font-size: 14px; }
.tile .job .nm { font-size: 14px; }
.tile .pct { font-size: 48px; text-align: left; min-width: 0; }
.tile .pct small { font-size: 24px; }
.tile .prog { flex-direction: column; align-items: stretch; gap: 4px; }
.tile .seg { flex: none; height: 14px; }
.tile .note { font-size: 14px; min-height: 0; }
.tile .bigread { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
.tile .bigread span { font: 400 12px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
.tile .bigread b { font: 600 28px/1 var(--font-display); letter-spacing: 0.02em; }
.tile .reads dd { font-size: 16px; }
.tile .reads { margin-top: 0; border-top: 0; padding-top: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.nextup { display: flex; gap: 24px; align-items: baseline; font: 400 14px var(--font-mono); color: var(--text-muted); white-space: nowrap; overflow: hidden; }
.nextup b { color: var(--text); font-weight: 500; }
.nextup .k { letter-spacing: 0.06em; text-transform: uppercase; font-size: 12px; }

@media (max-height: 800px) {
  .events li:nth-child(n+5) { display: none; }
  .trace figcaption { display: none; }
  #desk { padding: 12px 16px; gap: 12px; }
  .bay { gap: 4px; padding: 8px 12px; }
  .pct { font-size: 30px; }
  .reads { padding-top: 4px; }
  .note { min-height: 0; }
}
@media (max-width: 1100px) {
  body { overflow: auto; display: block; }
  .titlebar { position: sticky; top: 0; z-index: 10; height: var(--titlebar-h); }

const WORD = { printing: "Printing", heating: "Heating", paused: "Paused", warning: "Low filament", failed: "Failed", done: "Done", idle: "Idle" };

}

const setT = (el, v, html) => { const k = html ? "innerHTML" : "textContent"; if (el[k] !== String(v) && el.dataset.last !== String(v)) { el[k] = v; el.dataset.last = String(v); } };

const LOG = [

// ---------- actions ----------
let armed = null;
function act(name, p, btn) {

  } else if (name === "pause") { p.state = "paused"; toast(`${p.call} paused at layer ${layerOf(p)}.`);
  } else if (name === "resume") { p.state = "printing"; toast(`${p.call} resumed.`);
  } else if (name === "restart") { Object.assign(p, { state: "heating", left: p.total, nozC: Math.max(24, p.nozC ?? 90), bedC: Math.max(24, p.bedC ?? 40) }); toast(`Restarting ${p.job} on ${p.call}. Check the bed is clear first.`);
  } else if (name === "clear") { Object.assign(p, { state: "idle", lastJob: p.job, lastDone: p.failedAt, job: null }); toast(`${p.call} alert cleared. The failed job is not requeued.`);
  } else if (name === "bedclear") { p.state = "idle"; toast(`${p.call} is ready for the next job.`);
  } else if (name === "startnext") {
    const j = nextFor(p); if (!j) return; queue = queue.filter((q) => q !== j); const f = fileOf(j.file);
    Object.assign(p, { state: "heating", job: j.file, mat: f.mat, total: f.min * 60, left: f.min * 60, layers: Math.round(f.min * 1.7), jobM: f.m, nozT: f.mat === "PLA" ? 210 : f.mat === "ABS" ? 255 : f.mat === "TPU" ? 225 : 235, bedT: f.mat === "PLA" ? 60 : f.mat === "ABS" ? 100 : 80, nozC: p.nozC ?? 26, bedC: p.bedC ?? 24 });

}

  renderStrip(); renderAlerts();

const nextupEl = $("#nextup");

// ---------- live feed (one batched update per second; pausable) ----------
function tick() {
  tickN++; if (tickN < 1) return;
  printers.forEach((p) => {
    if (p.state === "printing") {
      p.left = Math.max(0, p.left - SPEED); p.spool = Math.max(0, p.spool - (p.jobM / p.total) * SPEED / 3.3);
      if (p.left <= 0) { Object.assign(p, { state: "done", left: 0, nozC: p.nozT, bedC: p.bedT }); toast(`${p.call} finished ${p.job}. Clear the bed.`); announce(`${p.call} finished ${p.job}.`); }
    } else if (p.state === "heating") {
      p.nozC = Math.min(p.nozT, p.nozC + 9); p.bedC = Math.min(p.bedT, p.bedC + 3);
      if (p.nozC >= p.nozT && p.bedC >= p.bedT) { p.state = "printing"; toast(`${p.call} started printing ${p.job}.`); }
    } else if (p.state === "failed" || p.state === "done" || p.state === "idle") {
      const lo = 24; p.nozC = Math.max(lo, (p.nozC ?? lo) - (p.state === "done" ? 4 : 1.6)); p.bedC = Math.max(lo, (p.bedC ?? lo) - 0.6);
    }
  });

}
printers.forEach((p) => { if (p.state === "failed") { p.nozC = 96; p.bedC = 41; } if (p.state === "idle") { p.nozC = 26; p.bedC = 24; } });
for (let k = 0; k < HN; k++) { tickN = k; printers.forEach((p) => { if (p.state === "failed") { p.nozC = 96 + (HN - k) * 2.5; p.bedC = 41 + (HN - k) * 0.4; } if (p.state === "heating") { p.nozC = 148 - (HN - k) * 1.2; p.bedC = 82 - (HN - k) * 0.5; } sample(p); }); }
printers.forEach((p) => { if (p.state === "failed") { p.nozC = 96; p.bedC = 41; } if (p.state === "heating") { p.nozC = 148; p.bedC = 82; } });
setInterval(() => { if (feedOn) tick(); }, 1000);
setInterval(() => { $("#clock").textContent = clockNow(); }, 1000); $("#clock").textContent = clockNow();
$("#btnLive").addEventListener("click", (e) => {
  feedOn = !feedOn; const b = e.currentTarget; b.setAttribute("aria-pressed", String(!feedOn));
  b.innerHTML = `${svg(feedOn ? "paused" : "printing")}<span class="lbl">${feedOn ? "Pause feed" : "Resume feed"}</span>`;
  toast(feedOn ? "Live feed resumed." : "Live feed paused. Figures are frozen.");
});

// ---------- mode ----------
function setMode(m) {
  mode = m; document.body.dataset.mode = m;
  $("#modeLbl").textContent = m === "display" ? "Desk mode" : "Display mode";
  $("#btnMode").firstElementChild.firstElementChild.setAttribute("href", m === "display" ? "#i-desk" : "#i-display");
  try { localStorage.setItem("forge-mode", m); } catch {}
  if (m === "display") { introPending = true; scene?.invalidate(); }
  refreshAll();
}
$("#btnMode").addEventListener("click", () => setMode(mode === "desk" ? "display" : "desk"));
addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === "d") setMode(mode === "desk" ? "display" : "desk");
  else if (k === "escape" && mode === "display") setMode("desk");
  else if (k === "q") { e.preventDefault(); if (mode === "display") setMode("desk"); fFile.focus(); }
  else if (/^[1-6]$/.test(k)) { select(+k); if (mode === "desk") baysEl.children[k - 1].querySelector(".bay-id").focus(); }
});

// ================= fallback: the same six bays drawn flat from the same data =================
const fb = $("#fallback");
const cvar = { printing: "--accent", warning: "--warning", heating: "--info", paused: "--info", failed: "--danger", done: "--success", idle: "--border-strong" };
function drawFallback() {
  if (mode !== "display" || $("#scene").dataset.scene === "live" || $("#scene").dataset.scene === "still") return;
  let h = `<svg viewBox="0 0 1800 440" preserveAspectRatio="xMidYMax meet" role="presentation">`;
  printers.forEach((p, i) => {
    const vs = vstate(p), c = `var(${cvar[vs]})`, cx = 150 + i * 300, base = 380, H = 230, pr = progress(p);
    h += `<g>
      <path d="M${cx - 100} ${base}h200" stroke="var(--border-strong)" stroke-width="2"/>
      <path d="M${cx - 100} ${base - H}v${H}M${cx + 100} ${base - H}v${H}M${cx - 100} ${base - H}h200" fill="none" stroke="${c}" stroke-width="2" opacity=".75"/>`;
    if (vs === "failed") h += `<rect x="${cx - 10}" y="${base - 90}" width="86" height="70" fill="${c}" opacity=".5" transform="rotate(24 ${cx} ${base})"/><path d="M${cx - 60} ${base - 12}c20 -90 60 -30 40 -110s70 20 90 -30" fill="none" stroke="${c}" stroke-width="3"/>`;
    else if (pr > 0 && p.state !== "heating") { const ph = Math.max(2, pr * (H - 24)); h += `<rect x="${cx - 46}" y="${base - ph}" width="92" height="${ph}" fill="${c}" opacity=".45" stroke="${c}"/>`; if (p.state !== "done") h += `<path d="M${cx - 100} ${base - ph}h200" stroke="${c}" stroke-width="3"/><circle cx="${cx}" cy="${base - ph}" r="6" fill="${c}"/>`; }
    h += `</g>`;
  });
  fb.innerHTML = h + `</svg>`;
}

// ================= the 3D scene (display mode only; level 2) =================
const host = $("#scene");
let theme = readTheme(), scene = null, introPending = true, motionPaused = false;
let T, renderer, camera, sc, bays = [], rig = {}, introStart = null, ease = bezier(...theme.motion.ease);
const SP = 3, BW = 2.2, BH = 2.5, PART_H = 1.75;

function col(c) { return new T.Color().setRGB(c.linear[0], c.linear[1], c.linear[2], T.LinearSRGBColorSpace); }
function mixc(a, b, t) { const m = mixOklab(a.linear, b.linear, t); return new T.Color().setRGB(m[0], m[1], m[2], T.LinearSRGBColorSpace); }
function rng(seed) { let s = seed; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function radialTex(inner, outer) {
  const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d");
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, inner); gr.addColorStop(1, outer); g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new T.CanvasTexture(c); return t;
}

function partGeo(i) {
  const g = new T.Group(), mat = rig.partMat;
  const add = (geo, x = 0, z = 0) => { geo.translate(x, PART_H / 2, z); const m = new T.Mesh(geo, mat); g.add(m); };
  const sizes = [[1.1, PART_H, 0.7], null, null, null, null, [0.7, PART_H * .8, 1.3]];
  if (i === 0 || i === 3) add(new T.BoxGeometry(1.1, PART_H, 0.7));
  else if (i === 1) add(new T.CylinderGeometry(0.55, 0.65, PART_H, 36));
  else if (i === 2) add(new T.CylinderGeometry(0.4, 0.8, PART_H, 5));
  else if (i === 4) { [-0.55, 0, 0.55].forEach((x) => add(new T.BoxGeometry(0.4, PART_H * .85, 0.4), x, x * 0.3)); }
  else add(new T.BoxGeometry(0.8, PART_H * .8, 1.2));
  return g;
}

function makeBay(i) {
  const g = new T.Group(); g.position.x = (i - 2.5) * SP;
  const blob = new T.Mesh(new T.PlaneGeometry(3.6, 3.6), new T.MeshBasicMaterial({ map: rig.blobTex, transparent: true, depthWrite: false, color: 0x000000, opacity: 0.55 }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.005; g.add(blob);
  const plate = new T.Mesh(new T.BoxGeometry(BW, 0.08, BW), rig.plateMat); plate.position.y = 0.04; g.add(plate);
  const frameMat = new T.LineBasicMaterial({ transparent: true });
  const frame = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(BW, BH, BW)), frameMat); frame.position.y = 0.08 + BH / 2; g.add(frame);
  const part = partGeo(i); part.position.y = 0.08; g.add(part);
  const partMat = rig.partMat.clone(); part.children.forEach((m) => (m.material = partMat));
  // gantry + hotend at the current layer
  const head = new T.Group();
  head.add(new T.Mesh(new T.BoxGeometry(BW, 0.05, 0.06), rig.metalMat));
  const blk = new T.Mesh(new T.BoxGeometry(0.22, 0.2, 0.22), rig.metalMat); blk.position.y = 0.12; head.add(blk);
  const cone = new T.Mesh(new T.ConeGeometry(0.06, 0.14, 12), rig.metalMat); cone.rotation.x = Math.PI; cone.position.y = -0.1; head.add(cone);
  const spot = new T.Mesh(new T.SphereGeometry(0.045, 12, 8), new T.MeshBasicMaterial({ color: 0xffffff })); spot.position.y = -0.2; head.add(spot);
  g.add(head);
  // failed print: a toppled lump and tangled strands
  const fail = new T.Group(); const r = rng(7 + i);
  const lump = new T.Mesh(new T.BoxGeometry(0.85, 0.6, 0.6), partMat); lump.position.set(0.35, 0.45, 0.2); lump.rotation.set(0.1, 0.5, 0.6); fail.add(lump);
  const strandMat = new T.MeshBasicMaterial({ color: 0xffffff });
  for (let k = 0; k < 11; k++) {
    const pts = []; let x = (r() - 0.5) * 1.4, y = 0.15, z = (r() - 0.5) * 1.4;
    for (let n = 0; n < 6; n++) { pts.push(new T.Vector3(x, y, z)); x += (r() - 0.5) * 0.9; y += r() * 0.35; z += (r() - 0.5) * 0.9; x = Math.max(-1, Math.min(1, x)); z = Math.max(-1, Math.min(1, z)); }
    fail.add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), 24, 0.012, 4), strandMat));
  }
  fail.position.y = 0.08; g.add(fail);
  // heating glow ring on the plate
  const ring = new T.Mesh(new T.RingGeometry(0.75, 0.85, 48), new T.MeshBasicMaterial({ transparent: true, side: T.DoubleSide, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.1; g.add(ring);
  sc.add(g);
  return { g, frameMat, part, partMat, head, spot, fail, strandMat, ring, i };
}

function buildScene(canvas) {
  renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
  renderer.setClearColor(0x000000, 0);
  sc = new T.Scene();
  camera = new T.PerspectiveCamera(28, 3, 0.1, 100);
  rig.blobTex = radialTex("rgba(255,255,255,1)", "rgba(255,255,255,0)");
  rig.glowTex = radialTex("rgba(255,255,255,0.9)", "rgba(255,255,255,0)");
  rig.plateMat = new T.MeshStandardMaterial({ roughness: 0.9, metalness: 0 });
  rig.metalMat = new T.MeshStandardMaterial({ roughness: 0.35, metalness: 0.7 });
  rig.partMat = new T.MeshStandardMaterial({ roughness: 0.45, metalness: 0.1, transparent: true });
  rig.key = new T.DirectionalLight(0xffffff, 2.4); rig.key.position.set(-5, 9, 6); sc.add(rig.key);
  rig.rim = new T.DirectionalLight(0xffffff, 1.1); rig.rim.position.set(6, 4, -8); sc.add(rig.rim);
  rig.fill = new T.HemisphereLight(0xffffff, 0xffffff, 0.7); sc.add(rig.fill);
  rig.alarm = new T.PointLight(0xffffff, 0, 9, 1.6); sc.add(rig.alarm);
  // the scan beam: a soft vertical plane that moves across the bays once
  rig.beam = new T.Mesh(new T.PlaneGeometry(2.8, 4.2), new T.MeshBasicMaterial({ map: rig.glowTex, transparent: true, blending: T.AdditiveBlending, depthWrite: false, opacity: 0.0 }));
  rig.beam.position.set(-12, 1.6, 0.4); sc.add(rig.beam);
  rig.beamLine = new T.Mesh(new T.PlaneGeometry(0.03, 3.4), new T.MeshBasicMaterial({ transparent: true, blending: T.AdditiveBlending, depthWrite: false, opacity: 0 }));
  rig.beamLine.position.set(-12, 1.5, 0.45); sc.add(rig.beamLine);
  for (let i = 0; i < 6; i++) bays.push(makeBay(i));
  recolor();
}

function recolor() {
  const c = theme.color;
  rig.plateMat.color.copy(mixc(c.surface2, c.surface3, 0.6));
  rig.metalMat.color.copy(mixc(c.surface3, c.text, 0.35));
  rig.key.color.copy(mixc(c.text, c.accent, 0.12)); rig.rim.color.copy(col(c.accent)); rig.fill.color.copy(mixc(c.surface3, c.accent, 0.25)); rig.fill.groundColor.copy(col(c.bg));
  rig.alarm.color.copy(col(c.danger));
  rig.beam.material.color.copy(col(c.accent)); rig.beamLine.material.color.copy(mixc(c.accent, c.text, 0.4));
  ease = bezier(...theme.motion.ease);
}

const CAM_Y = 0.32, FOCUS_ZOOM = 0.94;
const failedIdx = () => printers.findIndex((p) => vstate(p) === "failed");
function fit(w, h) {
  // a long lens (about 36 degrees across the row) keeps the bays from stretching at the edges; the vertical angle follows from the box
  camera.aspect = w / h;
  const visW = Math.max(SP * 6.3, 5.4 * camera.aspect), visH = visW / camera.aspect;
  rig.D = visW / (2 * Math.tan(Math.PI / 10));
  camera.fov = (2 * Math.atan(visH / 2 / rig.D) * 180) / Math.PI;
  camera.updateProjectionMatrix();
}
function placeCamera(k) {              // k = 0 overview, 1 focused on the failed bay
  const fi = failedIdx(), D = rig.D * (1 - (1 - FOCUS_ZOOM) * k);
  const fx = fi >= 0 ? (fi - 2.5) * SP * 0.12 * k : 0;
  camera.position.set(fx, D * CAM_Y + 0.4, D * 0.95);
  camera.lookAt(fx * 0.9, 0.95 - 0.1 * k, 0);
}

function applyData(power, pulse) {
  const c = theme.color;
  const fi = failedIdx();
  bays.forEach((b) => {
    const p = printers[b.i], vs = vstate(p), pw = power[b.i];
    const sig = vs === "idle" ? c.borderStrong : vs === "failed" ? c.danger : vs === "warning" ? c.warning : vs === "heating" || vs === "paused" ? c.info : vs === "done" ? c.success : c.accent;
    const sel = selected === p.id;
    b.frameMat.color.copy(col(sig)); b.frameMat.opacity = (vs === "idle" ? 0.35 : 0.8) * (0.22 + 0.78 * pw) * (sel ? 1 : 0.9) + (sel ? 0.15 : 0);
    const pr = progress(p), showPart = (vs === "printing" || vs === "warning" || vs === "paused" || vs === "done") && pr > 0.005;
    b.part.visible = showPart && pw > 0.02; b.part.scale.y = Math.max(0.001, pr);
    b.partMat.color.copy(mixc(c.surface3, sig, vs === "done" ? 0.55 : 0.7)); b.partMat.emissive.copy(col(sig)); b.partMat.emissiveIntensity = 0.12; b.partMat.opacity = Math.min(1, pw * 1.2);
    const hv = (vs === "printing" || vs === "warning" || vs === "paused") && pw > 0.02;
    b.head.visible = hv; b.head.position.y = 0.08 + PART_H * pr + 0.18;
    b.spot.material.color.copy(col(sig)).multiplyScalar(2.2);
    b.fail.visible = vs === "failed" && pw > 0.02; b.strandMat.color.copy(col(c.danger)).multiplyScalar(1.4);
    if (vs === "failed") { b.partMat.color.copy(mixc(c.surface3, c.danger, 0.6)); b.partMat.emissive.copy(col(c.danger)); b.partMat.emissiveIntensity = 0.18; }
    b.ring.visible = vs === "heating" && pw > 0.02; b.ring.material.color.copy(col(c.info)); b.ring.material.opacity = 0.5 * pw;
  });
  rig.alarm.visible = fi >= 0;
  if (fi >= 0) { rig.alarm.position.set((fi - 2.5) * SP, 1.4, 1.6); rig.alarm.intensity = 5 * pulse * power[fi]; }
}

function sceneFrame(now, delta, state) {
  const tempo = Math.max(0.5, theme.motion.tempo);
  if (introPending) { introStart = now; introPending = false; }
  if (introStart === null) introStart = now;
  const S = 2200 * tempo, G = 1200 * tempo, PUL = 4 * 2000;
  let t = now - introStart, more = true;
  const quiet = state.reduced || motionPaused;
  if (quiet || t > S + PUL) { t = S + PUL + 1; more = false; }
  const power = bays.map((b) => {
    if (quiet || t >= S) return 1;
    const x = (-10.5 + 21 * ease(t / S)); return Math.min(1, Math.max(0, (x - (b.g.position.x - 1.1)) / 2.2));
  });
  // beam
  if (!quiet && t < S) {
    const x = -10.5 + 21 * ease(t / S); rig.beam.position.x = x; rig.beamLine.position.x = x;
    const o = Math.sin(Math.PI * Math.min(1, t / S)); rig.beam.material.opacity = 0.55 * o; rig.beamLine.material.opacity = 0.9 * o;
  } else { rig.beam.material.opacity = 0; rig.beamLine.material.opacity = 0; }
  // camera glide to the failed bay after the sweep
  const k = quiet ? 1 : ease(Math.min(1, Math.max(0, (t - S) / G)));
  placeCamera(failedIdx() >= 0 ? k : 0);
  // alarm: four slow pulses (0.5 Hz), then a steady glow
  const pulse = quiet || t > S + PUL ? 0.75 : t < S ? 0.3 : 0.75 + 0.25 * Math.sin((2 * Math.PI * (t - S)) / 2000 - Math.PI / 2);
  applyData(power, pulse);
  renderer.render(sc, camera);
  return more;
}

host.dataset.scene = "fallback";
scene = theme.immersive === 0 ? null : mountScene(host, {
  async init(canvas) {
    T = await import("https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js");
    buildScene(canvas);
  },
  resize(w, h, pr) { renderer.setPixelRatio(pr); renderer.setSize(w, h, false); fit(w, h); },
  frame: sceneFrame,
  dispose() { renderer?.dispose(); },
}, { need: "webgl", maxPixelRatio: 2 });

if (scene) {
  watchTheme((next) => { theme = next; if (T) recolor(); scene.invalidate(); });
  $("#btnReplay").addEventListener("click", () => { motionPaused = false; $("#btnMotion").setAttribute("aria-pressed", "false"); $("#btnMotion").textContent = "Pause motion"; introPending = true; scene.invalidate(); });
  $("#btnMotion").addEventListener("click", (e) => { motionPaused = !motionPaused; e.currentTarget.setAttribute("aria-pressed", String(motionPaused)); e.currentTarget.textContent = motionPaused ? "Resume motion" : "Pause motion"; if (!motionPaused) introPending = true; scene.invalidate(); });
} else { $("#sceneTools").hidden = true; }

// ---------- first paint: the screen already in use ----------
printers.forEach((p) => { baysEl.children[p.id - 1].dataset.state = ""; tilesEl.children[p.id - 1].dataset.state = ""; });
renderQueue(); renderLog(); refreshAll();
try { const m = localStorage.getItem("forge-mode"); if (m === "display") setMode("display"); } catch {}
if (location.hash === "#display") setMode("display");
</script>
</body>
