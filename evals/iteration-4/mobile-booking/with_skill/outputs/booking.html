<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a cut - Hartley &amp; Finch</title>
<!--
Design brief
Product: booking screen in the app of Hartley & Finch, a 14-shop barbershop chain (sample data)
User and feeling: someone on their phone, often on the way somewhere, wants a slot fast -> quick, easy, certain
Direction: Open-air marketplace (booking), rebuilt around a barber-pole oxblood accent; warm neutrals, light theme
Type: Figtree, 16px body, tabular numbers      Shape and depth: 14/20px radii, crisp rings, one raised level
Density and motion: touch (44px+), crisp 120-300ms      Platform: mobile web, one column
Signature: the pinned summary bar. It always states service, barber, time and the exact price, and becomes the Confirm button.
Primary task: pick a service, a barber and a slot, then confirm. Defaults are preselected (Haircut, Any barber, today, next free slot).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#FBF9F6; --surface:#FFFEFD; --surface-2:#F6F3EF; --surface-3:#EBE7E3;
  --border:#E6E2DE; --border-strong:#8F8A83;
  --text:#1E1A14; --text-muted:#5D5852; --text-subtle:#726D66;
  --accent:#9A3B2E; --accent-hover:#8B2D21; --accent-fg:#FFFFFF; --accent-soft:#FFEBE7; --accent-text:#9A3B2E; --focus:#9A3B2E;
  --success:#0E8745; --success-soft:#E8F9EB; --success-text:#00783B;
  --danger-text:#B51449;
  --shadow-color:39 32 24; --ring:rgb(39 32 24 / .08); --highlight:rgb(255 255 255 / .18);
  --font:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-sm:10px; --r:14px; --r-lg:20px;
  --raised:0 0 0 1px var(--ring),0 2px 4px rgb(var(--shadow-color) / .05),0 8px 16px rgb(var(--shadow-color) / .07);
  --overlay:0 0 0 1px var(--ring),0 8px 16px rgb(var(--shadow-color) / .07),0 24px 56px rgb(var(--shadow-color) / .14);
  --btn:inset 0 1px 0 var(--highlight),0 1px 2px rgb(var(--shadow-color) / .16),0 2px 6px rgb(var(--shadow-color) / .08);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:400 16px/1.5 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
  min-height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);
  padding-bottom:calc(96px + env(safe-area-inset-bottom));overflow-x:hidden;scroll-padding-bottom:120px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header with barber-pole stripe */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);
  padding:calc(8px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--border)}
header::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;
  background:repeating-linear-gradient(135deg,var(--accent) 0 8px,var(--surface) 8px 16px,#2B4A6F 16px 24px,var(--surface) 24px 32px)}
.top{display:flex;align-items:center;gap:8px;padding-top:4px}
.icon-btn{width:44px;height:44px;margin-left:-12px;display:grid;place-items:center;border:0;background:none;border-radius:50%}
.icon-btn:active{background:var(--surface-3)}
.top h1{font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.015em}
.shop{font-size:14px;line-height:20px;color:var(--text-muted)}
.shop b{font-weight:500;color:var(--text)}

main{padding:0 16px}
section{margin-top:24px}
h2{font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
h2 small{font-size:14px;font-weight:400;color:var(--text-muted)}

/* choice cards (radio inputs) */
.choice{position:relative;display:block}
.choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.choice input:focus-visible+.box{outline:2px solid var(--focus);outline-offset:2px}

/* services */
.services{display:grid;gap:8px}
.svc .box{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 16px;background:var(--surface);border-radius:var(--r);
  box-shadow:0 0 0 1px var(--border);transition:box-shadow 120ms var(--ease),background-color 120ms var(--ease),transform 120ms var(--ease)}
.svc input:checked+.box{box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.choice:active .box{transform:scale(.98)}
.svc .name{font-weight:600;line-height:20px}
.svc .meta{font-size:14px;line-height:20px;color:var(--text-muted)}
.svc .txt{flex:1;min-width:0}
.svc .price{font-weight:600;font-size:16px}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;flex:none;transition:background-color 120ms,border-color 120ms}
.tick svg{opacity:0;transition:opacity 120ms}
:checked+.box .tick{background:var(--accent);border-color:var(--accent)}
:checked+.box .tick svg{opacity:1}

/* barbers: horizontal scroller */
.scroller{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.barber{flex:none;width:96px;scroll-snap-align:start}
.barber .box{height:128px;padding:12px 8px;border-radius:var(--r);background:var(--surface);box-shadow:0 0 0 1px var(--border);
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;transition:box-shadow 120ms var(--ease),background-color 120ms var(--ease)}
.barber input:checked+.box{box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px;outline:1px solid var(--ring);outline-offset:-1px;margin-bottom:4px}
.barber .n{font-weight:600;font-size:14px;line-height:20px}
.barber .r{font-size:12px;line-height:16px;color:var(--text-muted)}

/* dates */
.dates{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:none;width:56px}
.date .box{height:68px;border-radius:var(--r);background:var(--surface);box-shadow:0 0 0 1px var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:box-shadow 120ms var(--ease),background-color 120ms var(--ease)}
.date .d{font-size:12px;line-height:16px;color:var(--text-muted)}
.date .n{font-size:20px;line-height:24px;font-weight:600}
.date input:checked+.box{background:var(--accent);box-shadow:var(--btn);color:var(--accent-fg)}
.date input:checked+.box .d{color:var(--accent-fg)}

/* slots */
.group{font-size:14px;line-height:20px;font-weight:500;color:var(--text-muted);margin:16px 0 8px}
.group:first-of-type{margin-top:0}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot .box{height:48px;border-radius:var(--r-sm);background:var(--surface);box-shadow:0 0 0 1px var(--border-strong);display:grid;place-items:center;font-weight:500;
  transition:box-shadow 120ms var(--ease),background-color 120ms var(--ease)}
.slot input:checked+.box{background:var(--accent);color:var(--accent-fg);box-shadow:var(--btn);font-weight:500}
.slot input:disabled{cursor:not-allowed}
.slot input:disabled+.box{background:var(--surface-2);box-shadow:0 0 0 1px var(--border);color:var(--text-subtle);text-decoration:line-through}
.note{font-size:14px;line-height:20px;color:var(--text-muted);margin-top:12px}
.empty{background:var(--surface-2);border-radius:var(--r);padding:16px;font-size:14px;line-height:20px;color:var(--text-muted)}
.empty b{display:block;color:var(--text);font-size:16px;line-height:24px;margin-bottom:4px}
.link{background:none;border:0;color:var(--accent-text);font-weight:600;padding:8px 0;min-height:44px;text-decoration:underline;text-underline-offset:3px}

/* pinned summary bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:480px;margin:0 auto;background:var(--surface);box-shadow:0 -1px 0 var(--border),0 -8px 24px rgb(var(--shadow-color) / .06);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;min-width:0}
.bar .when{font-weight:600;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .what{font-size:14px;line-height:20px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-height:48px;padding:0 24px;border-radius:var(--r);border:0;font-weight:600;transition:transform 120ms var(--ease),background-color 120ms var(--ease)}
.btn-primary{background:var(--accent);color:var(--accent-fg);box-shadow:var(--btn)}
.btn-primary:hover{background:var(--accent-hover)}
.btn:active{transform:scale(.97)}
.btn[disabled]{background:var(--surface-3);color:var(--text-subtle);box-shadow:none;cursor:not-allowed}
.btn-block{width:100%}
.btn-quiet{background:none;color:var(--accent-text);min-height:48px;width:100%;border:0;font-weight:600;border-radius:var(--r)}

/* confirm sheet */
.scrim{position:fixed;inset:0;background:rgb(30 26 20 / .45);z-index:10;opacity:0;pointer-events:none;transition:opacity 200ms var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:480px;margin:0 auto;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--overlay);
  padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;transform:translateY(100%);visibility:hidden;transition:transform 300ms var(--ease),visibility 0s 300ms}
.sheet.on{transform:none;visibility:visible;transition:transform 300ms var(--ease)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto 12px;opacity:.5}
.sheet h3{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.015em;margin-bottom:16px}
.rows{background:var(--surface-2);border-radius:var(--r);padding:4px 16px}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}
.row:last-child{border:0}
.row span:first-child{color:var(--text-muted);flex:none}
.row span:last-child{font-weight:500;text-align:right}
.row.total span{font-weight:600;font-size:18px}
.row.total span:first-child{color:var(--text)}
.policy{font-size:14px;line-height:20px;color:var(--text-muted);margin:16px 0}
.sheet .btn-primary{margin-bottom:4px}

/* success */
.done{text-align:center;padding:16px 0 4px}
.done .ok{width:56px;height:56px;border-radius:50%;background:var(--success-soft);color:var(--success-text);display:grid;place-items:center;margin:8px auto 16px}
.done h3{margin-bottom:8px}
.done p{color:var(--text-muted);margin-bottom:24px}
.done .rows{text-align:left;margin-bottom:16px}

.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));max-width:448px;margin:0 auto;z-index:7;background:var(--text);color:var(--bg);
  border-radius:var(--r-sm);padding:12px 16px;font-size:14px;line-height:20px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity 200ms var(--ease),transform 200ms var(--ease)}
.toast.on{opacity:1;transform:none}

@media (min-width:481px){ body{box-shadow:0 0 0 1px var(--border)} }
@media (max-width:640px),(pointer:coarse){ button,input{min-height:44px} input{font-size:16px} }
@media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important} }
</style>
</head>
<body>
<header>
  <div class="top">
    <button class="icon-btn" aria-label="Back to shops" type="button">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1>Book a cut</h1>
  </div>
  <p class="shop"><b>Hartley &amp; Finch, Soho</b> &middot; 14 Berwick Street</p>
</header>

<main id="app">
  <section aria-labelledby="h-svc">
    <h2 id="h-svc">Service <small>1 of 3</small></h2>
    <div class="services" id="services" role="radiogroup" aria-labelledby="h-svc"></div>
  </section>

  <section aria-labelledby="h-bar">
    <h2 id="h-bar">Barber <small>2 of 3</small></h2>
    <div class="scroller" id="barbers" role="radiogroup" aria-labelledby="h-bar"></div>
  </section>

  <section aria-labelledby="h-time">
    <h2 id="h-time">Date and time <small>3 of 3</small></h2>
    <div class="dates" id="dates" role="radiogroup" aria-label="Date"></div>
    <div id="slots" style="margin-top:8px"></div>
    <p class="note">Times shown are free for the barber you picked. Sample data.</p>
  </section>
</main>

<div class="bar" id="bar">
  <div class="sum" aria-live="polite">
    <div class="when num" id="barWhen"></div>
    <div class="what" id="barWhat"></div>
  </div>
  <button class="btn btn-primary" id="go" type="button">Review booking</button>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>

<script>
const SERVICES=[
  {id:'cut',name:'Haircut',desc:'Cut, wash and style',min:30,price:28},
  {id:'skin',name:'Skin fade',desc:'Fade, line-up and style',min:45,price:32},
  {id:'beard',name:'Beard trim',desc:'Shape, hot towel, oil',min:20,price:18},
  {id:'combo',name:'Cut and beard',desc:'Haircut plus beard trim',min:60,price:42},
  {id:'shave',name:'Hot towel shave',desc:'Straight razor, two towels',min:30,price:30}
];
const BARBERS=[
  {id:'any',name:'Any barber',sub:'Soonest slot',ini:'•••',bg:'#EBE7E3',fg:'#1E1A14'},
  {id:'marcus',name:'Marcus',sub:'4.9 · 212',ini:'MO',bg:'#F4D9D3',fg:'#7A2A1F'},
  {id:'dani',name:'Dani',sub:'4.8 · 167',ini:'DR',bg:'#D8E3EF',fg:'#1F3F66'},
  {id:'tomasz',name:'Tomasz',sub:'4.9 · 98',ini:'TK',bg:'#DDE8D6',fg:'#2F5A24'},
  {id:'ife',name:'Ife',sub:'5.0 · 54',ini:'IA',bg:'#EFE3C7',fg:'#6B4E0E'}
];
// Sample "now": Monday 16 Nov 2026, 10:12
const NOW=new Date(2026,10,16,10,12);
const DAYS=[...Array(7)].map((_,i)=>new Date(2026,10,16+i));
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TIMES=[];for(let h=10;h<20;h++){TIMES.push([h,0],[h,30]);}
const fmt=(h,m)=>String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
// deterministic pseudo-availability
const hash=s=>{let x=2166136261;for(const c of s){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return (x>>>0)};
const taken=(barber,day,t)=>hash(barber+day+t)%100<(barber==='marcus'?55:40);
function free(barber,di,t){
  const d=DAYS[di],[h,m]=t;
  if(di===0 && (h*60+m)<=NOW.getHours()*60+NOW.getMinutes()+15) return false;
  if(d.getDay()===0 && h>=17) return false;
  if(barber==='any') return BARBERS.slice(1).some(b=>!taken(b.id,di,fmt(h,m)));
  return !taken(barber,di,fmt(h,m));
}
function whoFor(barber,di,t){ if(barber!=='any')return BARBERS.find(b=>b.id===barber).name;
  const b=BARBERS.slice(1).find(b=>!taken(b.id,di,fmt(...t)));return b?b.name:''; }

const S={svc:'cut',barber:'any',day:0,time:null};
const $=id=>document.getElementById(id);
const dayLabel=(i,long)=>{const d=DAYS[i];const rel=i===0?'Today':i===1?'Tomorrow':WD[d.getDay()];return long?`${rel==='Today'||rel==='Tomorrow'?rel+', ':''}${WD[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`.replace(/^(\w+), \1/,'$1'):rel};
const tick='<span class="tick"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>';
const svc=()=>SERVICES.find(s=>s.id===S.svc), bar=()=>BARBERS.find(b=>b.id===S.barber);
const nextFree=()=>{for(const t of TIMES) if(free(S.barber,S.day,t)) return fmt(...t);return null};

function renderServices(){
  $('services').innerHTML=SERVICES.map(s=>`<label class="choice svc"><input type="radio" name="svc" value="${s.id}" ${s.id===S.svc?'checked':''}>
    <span class="box">${tick}<span class="txt"><span class="name" style="display:block">${s.name}</span><span class="meta" style="display:block">${s.min} min &middot; ${s.desc}</span></span><span class="price num">&pound;${s.price}</span></span></label>`).join('');
}
function renderBarbers(){
  $('barbers').innerHTML=BARBERS.map(b=>`<label class="choice barber"><input type="radio" name="barber" value="${b.id}" ${b.id===S.barber?'checked':''}>
    <span class="box"><span class="av" style="background:${b.bg};color:${b.fg}" aria-hidden="true">${b.id==='any'?'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M17 4.5a3.5 3.5 0 010 7M18.5 14.8c1.6.7 2.7 2.3 3 4.7"/></svg>':b.ini}</span>
    <span class="n">${b.name}</span><span class="r num">${b.sub}</span></span></label>`).join('');
}
function renderDates(){
  $('dates').innerHTML=DAYS.map((d,i)=>`<label class="choice date"><input type="radio" name="day" value="${i}" ${i===S.day?'checked':''} aria-label="${dayLabel(i,true)}">
    <span class="box"><span class="d">${i===0?'Today':WD[d.getDay()]}</span><span class="n num">${d.getDate()}</span></span></label>`).join('');
}
function renderSlots(){
  const all=TIMES.map(t=>({t,k:fmt(...t),ok:free(S.barber,S.day,t)}));
  const open=all.filter(x=>x.ok);
  const el=$('slots');
  if(!open.length){
    el.innerHTML=`<div class="empty"><b>${bar().name==='Any barber'?'Fully booked':bar().name+' is fully booked'} ${dayLabel(S.day,false).toLowerCase()}</b>Try another day, or pick a different barber.</div>
    <button class="link" id="nextDay" type="button">See ${dayLabel(Math.min(S.day+1,6),false)}</button>`;
    S.time=null;return;
  }
  if(S.time && !open.some(x=>x.k===S.time)) S.time=null;
  if(!S.time) S.time=open[0].k;
  const grp=(label,from,to)=>{const xs=all.filter(x=>x.t[0]>=from&&x.t[0]<to);
    return `<p class="group">${label}</p><div class="slots" role="radiogroup" aria-label="${label}">`+xs.map(x=>`<label class="choice slot"><input type="radio" name="slot" value="${x.k}" ${x.ok?'':'disabled'} ${x.k===S.time?'checked':''}><span class="box num">${x.k}</span></label>`).join('')+'</div>'};
  el.innerHTML=grp('Morning',10,12)+grp('Afternoon',12,17)+grp('Evening',17,20);
}
function who(){return S.barber==='any'?whoFor('any',S.day,S.time.split(':').map(Number)):bar().name}
function renderBar(){
  const go=$('go');
  if(!S.time){$('barWhen').textContent='No time selected';$('barWhat').textContent='Pick another day or barber';go.disabled=true;return;}
  go.disabled=false;
  $('barWhen').textContent=`${dayLabel(S.day,false)} at ${S.time}`;
  $('barWhat').textContent=`${svc().name} with ${who()} · £${svc().price}`;
}
function renderAll(){renderServices();renderBarbers();renderDates();renderSlots();renderBar();}

document.addEventListener('change',e=>{
  const n=e.target.name,v=e.target.value;
  if(n==='svc')S.svc=v;
  else if(n==='barber'){S.barber=v;S.time=null;renderSlots();}
  else if(n==='day'){S.day=+v;S.time=null;renderSlots();}
  else if(n==='slot')S.time=v;
  renderBar();
});
document.addEventListener('click',e=>{
  if(e.target.id==='nextDay'){S.day=Math.min(S.day+1,6);S.time=null;renderDates();renderSlots();renderBar();}
});

const sheet=$('sheet'),scrim=$('scrim');
let lastFocus=null;
function open(){lastFocus=document.activeElement;scrim.classList.add('on');sheet.classList.add('on');setTimeout(()=>sheet.querySelector('button.btn')?.focus(),50)}
function close(){scrim.classList.remove('on');sheet.classList.remove('on');lastFocus&&lastFocus.focus()}
scrim.addEventListener('click',close);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet.classList.contains('on'))close()});

const rows=()=>{const d=DAYS[S.day];const end=(()=>{const [h,m]=S.time.split(':').map(Number);const t=h*60+m+svc().min;return fmt(Math.floor(t/60),t%60)})();
 return `<div class="rows">
  <div class="row"><span>Service</span><span>${svc().name} &middot; ${svc().min} min</span></div>
  <div class="row"><span>Barber</span><span>${who()}</span></div>
  <div class="row"><span>When</span><span class="num">${dayLabel(S.day,true)}<br>${S.time}–${end}</span></div>
  <div class="row"><span>Where</span><span>Soho, 14 Berwick Street</span></div>
  <div class="row total"><span>Total</span><span class="num">&pound;${svc().price}</span></div></div>`};

$('go').addEventListener('click',()=>{
  sheet.innerHTML=`<div class="grab"></div><h3 id="sheetTitle">Confirm your booking</h3>${rows()}
   <p class="policy">Pay in the shop. Free cancellation up to 2 hours before your slot.</p>
   <button class="btn btn-primary btn-block" id="confirm" type="button">Confirm booking &middot; &pound;${svc().price}</button>
   <button class="btn-quiet" id="edit" type="button">Change details</button>`;
  open();
});
sheet.addEventListener('click',e=>{
  if(e.target.id==='edit')close();
  if(e.target.id==='confirm'){
    const b=e.target;b.disabled=true;b.textContent='Booking…';
    setTimeout(()=>{
      sheet.innerHTML=`<div class="grab"></div><div class="done"><div class="ok"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
       <h3 id="sheetTitle">You're booked in</h3><p>${who()} will see you ${dayLabel(S.day,false).toLowerCase()} at ${S.time}. We've sent the details to your phone.</p></div>${rows()}
       <button class="btn btn-primary btn-block" id="cal" type="button">Add to calendar</button>
       <button class="btn-quiet" id="again" type="button">Make another booking</button>`;
      sheet.querySelector('#cal').focus();
    },700);
  }
  if(e.target.id==='cal'){const t=$('toast');t.textContent='Added to your calendar (sample).';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),4000)}
  if(e.target.id==='again'){close();window.scrollTo({top:0,behavior:'smooth'})}
});

renderAll();
</script>
</body>
</html>
