<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacts - Option A (Mockup v1)</title>
<style>
:root{--bg:#F8FAFC;--surface:#fff;--surface-2:#F1F5F9;--border:#E2E8F0;--border-strong:#64748B;--text:#0F172A;--muted:#475569;--accent:#1D4ED8;--accent-fg:#fff;--accent-soft:#EFF6FF;--hot:#B91C1C;--hot-bg:#FEF2F2;--warm:#92400E;--warm-bg:#FFFBEB;--cold:#334155;--cold-bg:#F1F5F9;--font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/20px var(--font);display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.side{background:var(--surface);border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:24px}
.brand{font-weight:600;font-size:16px;padding:0 8px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:8px;padding:0 8px;height:36px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current]{background:var(--accent-soft);color:var(--accent)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{padding:24px 32px;max-width:1440px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:24px;line-height:32px;margin:0;font-weight:600}
.sub{color:var(--muted);margin:4px 0 0}
.btn{height:36px;padding:0 16px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:500 14px var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:#1E40AF}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar input,.bar select{height:36px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);padding:0 12px;font:14px var(--font);color:var(--text)}
.bar input{width:300px;max-width:100%}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;color:var(--muted)}
.chips:empty{display:none}
.chip{display:inline-flex;gap:4px;align-items:center;height:28px;padding:0 8px 0 12px;border-radius:6px;background:var(--accent-soft);color:var(--accent);border:0;font:500 14px var(--font);cursor:pointer}
.tw{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:0 16px;height:36px;border-bottom:1px solid var(--border);white-space:nowrap}
td,th[scope=row]{padding:0 16px;height:44px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
th[scope=row]{font-weight:500;text-align:left;font-size:14px;color:var(--text);background:none;position:static}
th[scope=row] a{text-decoration:none}
th[scope=row] a:hover{color:var(--accent);text-decoration:underline}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 8px;border-radius:6px;font-weight:500;font-size:12px}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.Hot{color:var(--hot);background:var(--hot-bg)}.Warm{color:var(--warm);background:var(--warm-bg)}.Cold{color:var(--cold);background:var(--cold-bg)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);flex-wrap:wrap;gap:8px}
.ib{width:36px;height:36px;display:inline-grid;place-items:center;border:0;background:none;border-radius:6px;color:var(--muted);cursor:pointer}
.ib:hover{background:var(--surface);color:var(--text)}
.cards{display:none}
.tag{position:fixed;right:16px;bottom:16px;background:var(--text);color:#fff;padding:4px 12px;border-radius:6px;font-size:12px}
@media (max-width:900px){
 body{grid-template-columns:1fr}
 .side{flex-direction:row;align-items:center;padding:8px 16px;border-right:0;border-bottom:1px solid var(--border);overflow-x:auto}
 .nav{flex-direction:row}
 main{padding:16px}
}
@media (max-width:640px){
 .tw{display:none}.cards{display:flex;flex-direction:column;gap:8px}
 .card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 16px;display:grid;gap:4px;text-decoration:none;min-height:44px}
 .card b{font-size:16px}
 .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
 .btn,.bar input,.bar select,.nav a{min-height:44px}
 .bar input,.bar select{font-size:16px;width:100%}
 .tag{display:none}
}
</style></head><body>
<aside class="side">
 <div class="brand">Harbourline Realty</div>
 <nav class="nav" aria-label="Main">
  <a href="#"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Properties</a>
  <a href="#" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 010 8M22 21c0-3-2-5-4-5.5"/></svg>Contacts</a>
  <a href="#"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Viewings</a>
  <a href="#"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
 </nav>
</aside>
<main>
 <div class="head">
  <div><h1>Contacts</h1><p class="sub">248 people across 3 agents.</p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">Import</button><button class="btn btn-primary">Add contact</button></div>
 </div>
 <div class="bar" role="search">
  <input type="search" id="q" placeholder="Search name, phone or property" aria-label="Search contacts">
  <select id="ft" aria-label="Type"><option value="">All types</option><option>Buyer</option><option>Seller</option><option>Tenant</option><option>Landlord</option></select>
  <select id="fa" aria-label="Agent"><option value="">All agents</option><option>Priya Nair</option><option>Tom Reyes</option><option>Jess Abara</option></select>
 </div>
 <div class="chips" id="chips" aria-live="polite"></div>
 <div class="tw" tabindex="0" role="region" aria-label="Contacts table">
 <table><caption style="position:absolute;left:-9999px">Contacts</caption>
  <thead><tr><th scope="col">Name</th><th scope="col">Type</th><th scope="col">Status</th><th scope="col">Looking for</th><th scope="col" class="num">Budget (AUD)</th><th scope="col">Agent</th><th scope="col">Last contact</th><th scope="col"><span style="position:absolute;left:-9999px">Actions</span></th></tr></thead>
  <tbody id="tb"></tbody></table></div>
 <div class="cards" id="cards"></div>
 <div class="foot"><span id="count"></span><span>Page 1 of 25 &nbsp; <button class="btn">Previous</button> <button class="btn">Next</button></span></div>
</main>
<div class="tag">Mockup v1 - sample data</div>
<script src="data.js"></script>
<script>
const tb=document.getElementById("tb"),cards=document.getElementById("cards"),chips=document.getElementById("chips");
const q=document.getElementById("q"),ft=document.getElementById("ft"),fa=document.getElementById("fa");
const phone='<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>';
function draw(){
 const s=q.value.toLowerCase();
 const L=CONTACTS.filter(c=>(!ft.value||c.t===ft.value)&&(!fa.value||c.ag===fa.value)&&(!s||(c.n+c.ph+c.want).toLowerCase().includes(s)));
 tb.innerHTML=L.map(c=>`<tr><th scope="row"><a href="#">${c.n}</a></th><td>${c.t}</td><td><span class="badge ${c.s}">${c.s}</span></td><td class="muted">${c.want}</td><td class="num">${money(c)}</td><td>${c.ag}</td><td class="muted">${c.last}</td><td><button class="ib" aria-label="Call ${c.n}">${phone}</button></td></tr>`).join("")||`<tr><td colspan="8" style="height:96px;text-align:center">No contacts match these filters. Clear the filters to see everyone.</td></tr>`;
 cards.innerHTML=L.map(c=>`<a class="card" href="#"><div class="row"><b>${c.n}</b><span class="badge ${c.s}">${c.s}</span></div><span class="muted">${c.t} · ${c.want}</span><span class="muted">${c.ag} · ${c.last}</span></a>`).join("");
 document.getElementById("count").textContent=`Showing ${L.length} of 248 contacts`;
 chips.innerHTML=[ft.value&&["Type: "+ft.value,"ft"],fa.value&&["Agent: "+fa.value,"fa"]].filter(Boolean).map(x=>`<button class="chip" data-r="${x[1]}">${x[0]} &times;</button>`).join("");
}
chips.onclick=e=>{const b=e.target.closest(".chip");if(b){document.getElementById(b.dataset.r).value="";draw()}};
[q,ft,fa].forEach(e=>e.addEventListener("input",draw));draw();
</script></body></html>
