schema_version: "1.1"
name: printfarm-desktop-app
expected_outcome: |
  A desktop app window (sidebar or toolbar shell, no marketing hero, no scroll story) that borrows a sci-fi console language through a few traits (type, lines, signal colour) while staying a fast, readable work tool: failures first, full contrast, real controls, no ambient motion that runs all day, any 3D kept small and functional with a still fallback, original (no copied game UI).
