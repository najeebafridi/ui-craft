name: observatory-themed-hero
expected_outcome: |
  A home page that follows the supplied theme tokens (accent #7FA8FF, Barlow Condensed and Outfit, hairline depth, crisp motion) and the chosen intensity (level 2: one hero moment, then a normal page). The scene's colours come from the tokens and follow light and dark. Real event content with dates and a booking action, a reduced-motion still, a no-WebGL fallback, text as HTML.
