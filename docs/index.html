<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ui-craft Studio</title>
<meta name="description" content="Pick a visual direction, set your brand colour, fonts, shape and motion, watch live screens change, and export an accessible theme for any framework. Free and open source.">
<!-- ui-craft Studio v2.1.1. Generated by tools/build-studio.mjs from tools/studio/template.html. Edit the template, not this file.
     One self-contained page: no install, no build step, no tracking. Fonts load from Google Fonts. -->
<style>
:root{
  --c-bg:#F4F4F5; --c-panel:#FFFFFF; --c-soft:#F4F4F5; --c-line:#E4E4E7; --c-line-strong:#8D8D99;
  --c-text:#18181B; --c-muted:#52525B; --c-subtle:#6B6B76; --c-solid:#18181B; --c-solid-fg:#FFFFFF; --c-focus:#2563EB;
  --c-shadow:0 0 0 1px rgb(24 24 27/.08),0 1px 2px rgb(24 24 27/.06),0 2px 4px rgb(24 24 27/.05);
  --c-overlay:0 0 0 1px rgb(24 24 27/.08),0 8px 16px rgb(24 24 27/.08),0 24px 48px rgb(24 24 27/.14);
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --c-bg:#0E0E10; --c-panel:#17171A; --c-soft:#222226; --c-line:#2A2A30; --c-line-strong:#6B6B76;
  --c-text:#EDEDEF; --c-muted:#A1A1AA; --c-subtle:#8E8E99; --c-solid:#EDEDEF; --c-solid-fg:#18181B; --c-focus:#60A5FA;
  --c-shadow:0 0 0 1px rgb(255 255 255/.08); --c-overlay:0 0 0 1px rgb(255 255 255/.1),0 24px 48px rgb(0 0 0/.6);
  color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--c-bg);color:var(--c-text);font:400 14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c-focus);outline-offset:2px}
[hidden]{display:none!important}

/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px 16px;background:var(--c-panel);box-shadow:0 1px 0 var(--c-line)}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{width:24px;height:24px;flex:none}
.brand h1{font-size:16px;font-weight:600;letter-spacing:-0.01em}
.brand span{color:var(--c-subtle);font-size:12px}
.seg{display:inline-flex;padding:4px;background:var(--c-soft);border-radius:8px;gap:4px}
.seg button{height:32px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--c-muted);font-weight:500;cursor:pointer;transition:background-color .12s,color .12s,transform .12s}
.seg button[aria-pressed="true"]{background:var(--c-panel);color:var(--c-text);box-shadow:var(--c-shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:8px;border:1px solid var(--c-line-strong);background:var(--c-panel);color:var(--c-text);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color .12s,transform .12s}
.btn.solid{background:var(--c-solid);color:var(--c-solid-fg);border-color:transparent}
.btn:active,.seg button:active,.dir:active{transform:scale(.97)}
@media (hover:hover){.btn:hover{background:var(--c-soft)}.btn.solid:hover{opacity:.9}.seg button:hover{color:var(--c-text)}}

/* ---- layout ---- */
.layout{display:grid;grid-template-columns:336px minmax(0,1fr);align-items:start}
.panel{position:sticky;top:53px;height:calc(100vh - 53px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;background:var(--c-panel);box-shadow:1px 0 0 var(--c-line);padding:8px 16px 32px}
.group{padding:16px 0;border-bottom:1px solid var(--c-line)}
.group:last-child{border-bottom:0}
.group h2{font-size:12px;font-weight:600;color:var(--c-muted);margin-bottom:12px}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dir{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 8px;border:1px solid var(--c-line);border-radius:8px;background:var(--c-panel);cursor:pointer;text-align:left;font-size:12px;font-weight:500;line-height:1.3;transition:border-color .12s,background-color .12s,transform .12s}
.dir i{flex:none;width:24px;height:24px;border-radius:6px;box-shadow:inset 0 0 0 1px rgb(128 128 128/.35);display:grid;place-items:center}
.dir i b{width:10px;height:10px;border-radius:50%;display:block}
.dir[aria-pressed="true"]{border-color:var(--c-text);box-shadow:0 0 0 1px var(--c-text)}
@media (hover:hover){.dir:hover{background:var(--c-soft)}}
.field{display:grid;gap:4px;margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label,.field .lab{font-size:12px;font-weight:500;color:var(--c-text)}
.field .hint{font-size:12px;color:var(--c-subtle)}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}
input[type="text"],select{height:36px;width:100%;padding:0 8px;border:1px solid var(--c-line-strong);border-radius:8px;background:var(--c-panel)}
input[type="color"]{flex:none;width:44px;height:36px;padding:4px;border:1px solid var(--c-line-strong);border-radius:8px;background:var(--c-panel);cursor:pointer}
input[type="range"]{width:100%;height:24px;accent-color:var(--c-solid);margin:0}
input[type="checkbox"]{width:16px;height:16px;accent-color:var(--c-solid);margin:0}
.check{display:flex;align-items:center;gap:8px;min-height:24px;font-size:12px;font-weight:500}
output{font:500 12px var(--mono);color:var(--c-muted);min-width:40px;text-align:right}
.link{border:0;background:none;padding:4px 0;color:var(--c-muted);font-size:12px;font-weight:500;text-decoration:underline;text-underline-offset:2px;cursor:pointer}

/* ---- stage ---- */
.stage{padding:16px 24px 24px;min-width:0}
.stage-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.health{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--c-muted);padding:4px 12px;border-radius:999px;background:var(--c-panel);box-shadow:var(--c-shadow)}
.health::before{content:"";width:8px;height:8px;border-radius:50%;background:#16A34A}
.health[data-ok="false"]::before{background:#DC2626}
.frame-wrap{position:relative;height:calc(100vh - 248px);min-height:440px;border-radius:12px;overflow:hidden;background:var(--c-panel);box-shadow:var(--c-shadow)}
.frame-wrap[data-view="phone"]{background:transparent;box-shadow:none;display:grid;place-items:start center}
.frame-wrap iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:#fff}
.frame-wrap[data-view="phone"]{padding:12px 0}
.frame-wrap[data-view="phone"] iframe{position:static;transform:none;width:390px;max-width:calc(100% - 24px);height:100%;border-radius:32px;box-shadow:0 0 0 8px #1F1F23,0 0 0 9px var(--c-line-strong),var(--c-overlay)}
.about{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px;font-size:12px;color:var(--c-muted)}
.about b{display:block;color:var(--c-text);font-weight:600;margin-bottom:4px}
.fx{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--c-muted)}
.fx select{width:auto;height:32px}
.stage-bar .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.stage-bar .seg button{flex:none}
.notes{margin-top:12px;font-size:12px;color:var(--c-muted);display:grid;gap:4px}
.notes:empty{display:none}

/* ---- export dialog ---- */
dialog{width:min(880px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:0;border:0;border-radius:12px;background:var(--c-panel);color:var(--c-text);box-shadow:var(--c-overlay)}
dialog::backdrop{background:rgb(0 0 0/.45)}
.dlg{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;max-height:calc(100vh - 32px)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px 8px}
.dlg-head h2{font-size:16px;font-weight:600}
.tabs{display:flex;gap:4px;padding:0 24px 12px;overflow-x:auto;scrollbar-width:thin}
.tabs button{flex:none;height:32px;padding:0 12px;border:1px solid var(--c-line);border-radius:999px;background:transparent;color:var(--c-muted);font-weight:500;font-size:12px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--c-solid);color:var(--c-solid-fg);border-color:transparent}
.code{margin:0 24px;border-radius:8px;background:var(--c-soft);overflow:auto;min-height:160px}
.code pre{margin:0;padding:16px;font:400 12px/1.6 var(--mono);white-space:pre;tab-size:2}
.dlg-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 24px}
.dlg-foot p{margin-right:auto;font-size:12px;color:var(--c-muted);max-width:52ch}

/* ---- touch and small screens ---- */
@media (max-width:640px),(pointer:coarse){.btn,.seg button,input[type="text"],select,input[type="color"],input[type="range"],.tabs button{min-height:44px}.link{min-height:44px}.check{min-height:44px}input[type="text"],select{font-size:16px}}
@media (max-width:900px){
  .top{position:static}
  .layout{grid-template-columns:minmax(0,1fr)}
  .panel{position:static;height:auto;box-shadow:0 1px 0 var(--c-line);order:2}
  .stage{order:1;padding:16px}
  .frame-wrap{height:70vh}
  .layout{display:flex;flex-direction:column}
  .stage,.panel{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6" fill="var(--c-solid)"/><path d="M8 8v5a4 4 0 008 0V8" stroke="var(--c-solid-fg)" stroke-width="2" stroke-linecap="round"/></svg>
    <h1>ui-craft Studio</h1><span>v2.1.1</span>
  </div>
  <div class="seg" role="group" aria-label="Preview theme">
    <button type="button" data-theme="light">Light</button><button type="button" data-theme="dark">Dark</button>
  </div>
  <div class="seg" role="group" aria-label="Preview size">
    <button type="button" data-view="desktop">Desktop</button><button type="button" data-view="phone">Phone</button>
  </div>
  <button type="button" class="btn" id="share">Copy link</button>
  <button type="button" class="btn solid" id="open-export">Export theme</button>
</header>

<div class="layout">
  <aside class="panel" aria-label="Design controls">
    <section class="group">
      <h2>1. Direction</h2>
      <div class="dirs" id="dirs"></div>
    </section>

    <section class="group">
      <h2>2. Colour</h2>
      <div class="field">
        <label for="accent-hex">Brand colour</label>
        <div class="row"><input type="color" id="accent" aria-label="Brand colour picker"><input type="text" id="accent-hex" spellcheck="false" autocomplete="off" maxlength="7" aria-describedby="accent-hint"></div>
        <span class="hint" id="accent-hint">Text on it is checked for contrast and adjusted if needed.</span>
      </div>
      <div class="field">
        <label for="neutral">Greys</label>
        <select id="neutral"></select>
      </div>
      <div class="field">
        <label for="tint">How tinted the greys are</label>
        <div class="row"><input type="range" id="tint" min="0" max="3" step="1"><output id="tint-out" for="tint"></output></div>
      </div>
      <div class="field">
        <label class="check"><input type="checkbox" id="has-secondary"> Add a second colour</label>
        <div class="row" id="secondary-row" hidden><input type="color" id="secondary" aria-label="Second colour picker"><span class="hint">Use only if the product has a real job for it.</span></div>
      </div>
    </section>

    <section class="group">
      <h2>3. Type</h2>
      <div class="field"><label for="display">Headings</label><select id="display"></select></div>
      <div class="field"><label for="sans">Text</label><select id="sans"></select></div>
    </section>

    <section class="group">
      <h2>4. Shape and depth</h2>
      <div class="field">
        <label for="radius">Corner radius</label>
        <div class="row"><input type="range" id="radius" min="0" max="24" step="1"><output id="radius-out" for="radius"></output></div>
      </div>
      <div class="field"><label for="depth">Depth</label><select id="depth"></select></div>
      <div class="field"><label for="borderw">Border weight</label><select id="borderw"><option value="1">Fine (1px)</option><option value="2">Bold (2px)</option></select></div>
    </section>

    <section class="group">
      <h2>5. Feel</h2>
      <div class="field"><label for="density">Density</label><select id="density"></select></div>
      <div class="field"><label for="motion">Motion</label><select id="motion"></select></div>
      <div class="field"><label for="immersive">3D and scroll effects</label><select id="immersive" aria-describedby="immersive-hint"></select><span class="hint" id="immersive-hint">See it on the Immersive screen. Every level keeps a still fallback.</span></div>
      <button type="button" class="link" id="reset">Reset to this direction's defaults</button>
    </section>
  </aside>

  <main class="stage">
    <div class="stage-bar">
      <div class="seg" role="group" aria-label="Preview screen">
        <button type="button" data-screen="app">Dashboard</button><button type="button" data-screen="landing">Landing page</button><button type="button" data-screen="mobile">Mobile app</button><button type="button" data-screen="kit">Components</button><button type="button" data-screen="imm">Immersive</button>
      </div>
      <label class="fx" id="fx-wrap" hidden>Preview as <select id="fx"><option value="full">Full effect</option><option value="reduced">Reduced motion</option><option value="nogl">No WebGL (fallback)</option></select></label>
      <span class="health" id="health" role="status"></span>
    </div>
    <div class="frame-wrap" id="wrap" data-view="desktop"><iframe id="frame" title="Live preview of the theme"></iframe></div>
    <div class="notes" id="notes"></div>
    <div class="about" id="about"></div>
  </main>
</div>

<dialog id="export" aria-labelledby="export-title">
  <div class="dlg">
    <div class="dlg-head"><h2 id="export-title">Export theme</h2><button type="button" class="btn" id="close-export">Close</button></div>
    <div class="tabs" role="tablist" aria-label="Export format" id="formats"></div>
    <div class="code" tabindex="0" role="tabpanel" aria-label="Code"><pre id="code"></pre></div>
    <div class="dlg-foot"><p id="format-help"></p><button type="button" class="btn" id="download">Download file</button><button type="button" class="btn solid" id="copy">Copy</button></div>
  </div>
</dialog>

<!-- ============ the preview document (rendered inside the iframe) ============ -->
<script type="text/plain" id="pv-css">
body{min-height:100vh}
a{color:var(--accent-text);text-underline-offset:2px}
body > section{display:none}
body[data-screen="app"] > .s-app,body[data-screen="landing"] > .s-landing,body[data-screen="mobile"] > .s-mobile,body[data-screen="kit"] > .s-kit,body[data-screen="imm"] > .s-imm{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--control-h);padding:0 16px;border-radius:var(--radius);border:var(--border-w) solid transparent;font:500 14px var(--font-sans);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
.btn:active{transform:scale(var(--press-scale))}
.btn-primary{background:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow-button)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn-ghost{background:transparent;color:var(--text)}
.btn-danger{background:var(--danger-soft);color:var(--danger-text);border-color:var(--danger-text)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
@media (hover:hover){.btn-primary:hover{background:var(--accent-hover)}.btn-secondary:hover,.btn-ghost:hover{background:var(--surface-2)}}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-muted)}
.cur{color:var(--text-subtle);margin-right:1px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:var(--radius-full)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--success-soft);color:var(--success-text)}.b-warn{background:var(--warning-soft);color:var(--warning-text)}.b-bad{background:var(--danger-soft);color:var(--danger-text)}.b-info{background:var(--info-soft);color:var(--info-text)}
.card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-raised);border:var(--border-w) solid var(--border)}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- dashboard ---------- */
.s-app{font-size:14px}
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);box-shadow:1px 0 0 var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:8px;font:var(--weight-display) 16px var(--font-display);letter-spacing:var(--tracking-heading);padding:8px 12px 16px}
.logo i{width:20px;height:20px;border-radius:var(--radius-sm);background:var(--accent);display:block}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:var(--radius-sm);color:var(--text-muted);text-decoration:none;font-weight:500}
.nav a[aria-current]{background:var(--accent-soft);color:var(--accent-text)}
@media (hover:hover){.nav a:hover{background:var(--surface-2);color:var(--text)}}
.main{padding:32px;min-width:0;max-width:var(--content-max)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head h1{font-size:24px;letter-spacing:var(--tracking-heading)}
.head p{color:var(--text-muted);margin-top:4px}
.acts{display:flex;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}
.stat{padding:16px 20px}
.stat .k{font-size:12px;font-weight:500;color:var(--text-muted)}
.stat .v{font:var(--weight-display) 24px/1.2 var(--font-display);letter-spacing:var(--tracking-heading);margin-top:4px}
.stat .d{font-size:12px;color:var(--text-muted);margin-top:4px}
.up{color:var(--success-text)}.down{color:var(--danger-text)}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start;margin-bottom:16px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px}
.ph h2{font-size:16px;letter-spacing:var(--tracking-heading)}
.chart{padding:0 20px 16px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text-muted);padding:0 20px 16px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.list{list-style:none;margin:0;padding:0 20px 12px}
.list li{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:var(--row-h);border-top:1px solid var(--border)}
.list small{display:block;color:var(--text-subtle);font-size:12px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:0 20px;height:var(--row-h);border-top:1px solid var(--border);white-space:nowrap}
th{font-size:12px;font-weight:500;color:var(--text-muted);background:var(--surface-2);height:36px}
.r{text-align:right}
td b{font-weight:500}
@media (max-width:1024px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .shell{grid-template-columns:minmax(0,1fr)}.main{padding:16px 16px 88px}
  .side{position:fixed;inset:auto 0 0 0;flex-direction:row;padding:4px 8px;box-shadow:0 -1px 0 var(--border);z-index:5}
  .side .logo{display:none}.nav{flex-direction:row;flex:1}.nav a{flex:1;flex-direction:column;gap:4px;font-size:12px;min-height:48px;padding:4px 0;justify-content:center}
  .hide-sm{display:none}.btn{min-height:44px}
}

/* ---------- landing ---------- */
.s-landing{font-size:var(--text-body)}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}
.lnav{display:flex;align-items:center;gap:24px;height:64px}
.lnav .logo{padding:0;margin-right:auto}
.lnav a.l{color:var(--text-muted);text-decoration:none;font-size:14px;font-weight:500}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center;padding:var(--space-section) 0}
.hero h1{font-size:clamp(36px,5vw,60px);line-height:1.05;letter-spacing:var(--tracking-display)}
.hero p{font-size:18px;color:var(--text-muted);margin-top:16px;max-width:48ch}
.hero .acts{margin-top:24px;flex-wrap:wrap}
.hero .proof{font-size:14px;color:var(--text-subtle);margin-top:16px}
.shot{padding:16px;display:grid;gap:12px}
.shot .bar{display:flex;gap:8px;align-items:center}
.shot .dot{width:8px;height:8px;border-radius:50%;background:var(--surface-3)}

  if (A.C < 0.03 && neutral === "brand") { Hn = 255; notes.push("The brand colour is almost grey, so the greys use a cool tint. Choose warm or pure greys if you prefer."); }

  const ink = (L, k = 1) => oklch(L, Math.min(cn * k, 0.04), Hn);

  // Solid accent + text on it. Keep the brand colour when white text passes; darken a little if that is enough; else use dark text.
  function solid(base, surfaces, needVisible, what = "Brand colour") {
    let L = base.L;
    if (needVisible) { // dark theme: a very dark brand colour would vanish on a dark surface
      while (L < 0.9 && Math.min(...surfaces.map((s) => contrast(oklch(L, base.C, base.H), s))) < 3) L += 0.01;
      if (L !== base.L) notes.push(`${what} is lightened in the dark theme so buttons stay visible on dark surfaces.`);
    }
    let hex = oklch(L, base.C, base.H), fg = "#FFFFFF";
    if (contrast(hex, fg) < 4.5) {
      let L2 = L, hex2 = hex;
      while (L2 > L - 0.14 && contrast(hex2, "#FFFFFF") < 4.5) { L2 -= 0.005; hex2 = oklch(L2, base.C, base.H); }
      const stillVisible = !needVisible || Math.min(...surfaces.map((s) => contrast(hex2, s))) >= 3;
      if (contrast(hex2, "#FFFFFF") >= 4.5 && stillVisible) { hex = hex2; L = L2; notes.push(`${what} darkened slightly (${rgbToHex(hexToRgb(oklch(base.L, base.C, base.H)))} -> ${hex}) so white button text passes 4.5:1.`); }
      else { fg = oklch(0.2, 0.03, base.H); while (contrast(hex, fg) < 4.5 && L < 0.95) { L += 0.01; hex = oklch(L, base.C, base.H); } notes.push(`${what} is light, so text on it is dark, not white.`); }
    }
    let hover = oklch(L - 0.045, base.C, base.H);
    if (contrast(hover, fg) < 4.5) hover = oklch(L + 0.04, base.C, base.H);
    return { hex, fg, hover, L };
  }

  const STATUS = { success: [152, 0.14], warning: [65, 0.13], danger: [27, 0.19], info: [250, 0.16] };
  if (hueDist(A.H, 27) < 20 && A.C > 0.08) {
    STATUS.danger[0] = (A.H - 20 + 360) % 360; // move errors toward crimson, away from the brand hue
    notes.push("The brand colour is close to error red, so the error colour was shifted toward crimson. Never use the solid brand colour for errors, and always pair errors with an icon and text.");
  }
  const CHART_OFFSETS = [0, 137.5, 275, 52.5, 190, 327.5];

  function theme(dark) {
    const t = {};
    if (!dark) {
      t.bg = ink(0.982, 0.7); t.surface = ink(0.998, 0.25); t["surface-2"] = ink(0.965, 1); t["surface-3"] = ink(0.93, 1.15);
      t.border = ink(0.915, 1.2);
      t["border-strong"] = solve(Math.min(cn * 2, 0.04), Hn, 0.7, -1, 3.05, [t.surface, t["surface-2"], t.bg]);
      t.text = ink(0.22, 2.2);
      t["text-muted"] = solve(Math.min(cn * 2, 0.04), Hn, 0.52, -1, 6.3, [t["surface-2"]]);
      t["text-subtle"] = solve(Math.min(cn * 2, 0.04), Hn, 0.6, -1, 4.6, [t["surface-2"], t.bg]);
    } else {
      t.bg = ink(0.155, 1.4); t.surface = ink(0.195, 1.4); t["surface-2"] = ink(0.235, 1.4); t["surface-3"] = ink(0.275, 1.4);
      t.border = ink(0.285, 1.5);
      t["border-strong"] = solve(Math.min(cn * 1.5, 0.03), Hn, 0.45, 1, 3.05, [t.surface, t["surface-2"], t["surface-3"]]);
      t.text = ink(0.93, 0.8);
      t["text-muted"] = solve(Math.min(cn, 0.02), Hn, 0.7, 1, 6.3, [t["surface-2"]]);
      t["text-subtle"] = solve(Math.min(cn, 0.02), Hn, 0.6, 1, 4.6, [t["surface-2"], t["surface-3"]]);
    }
    const tintOn = [t.surface, t["surface-2"]];
    const brand = (prefix, base) => {
      const s = solid(base, [t.surface], dark, prefix === "accent" ? "Brand colour" : "Second colour");
      t[prefix] = s.hex; t[`${prefix}-hover`] = s.hover; t[`${prefix}-fg`] = s.fg;
      t[`${prefix}-soft`] = dark ? oklch(0.26, Math.min(base.C * 0.35, 0.07), base.H) : oklch(0.955, Math.min(base.C * 0.22, 0.035), base.H);
      t[`${prefix}-text`] = dark
        ? solve(Math.min(base.C * 0.75, 0.16), base.H, 0.72, 1, 4.6, [...tintOn, t[`${prefix}-soft`]])
        : solve(Math.min(base.C, 0.2), base.H, Math.min(base.L, 0.55), -1, 4.6, [...tintOn, t[`${prefix}-soft`]]);
    };
    brand("accent", A);
    if (secondary) brand("secondary", hexToOklch(secondary));
    t.focus = contrast(t.accent, t.surface) >= 3 && contrast(t.accent, t.bg) >= 3 ? t.accent : t["accent-text"];
    for (const [k, [H, C]] of Object.entries(STATUS)) {
      t[k] = dark ? solve(C * 0.9, H, 0.6, 1, 3.2, [t["surface-2"]]) : solve(C, H, 0.62, -1, 4.5, ["#FFFFFF", t.surface]);
      t[`${k}-soft`] = dark ? oklch(0.25, 0.045, H) : oklch(0.965, 0.025, H);
      t[`${k}-text`] = dark ? solve(C * 0.7, H, 0.75, 1, 4.6, [t[`${k}-soft`], t["surface-2"]]) : solve(C, H, 0.5, -1, 4.6, [t[`${k}-soft`], t.surface]);
    }
    // Chart colours: spread hues by the golden angle, alternate lightness so they also differ for colour-blind viewers.
    const chartL = dark ? [0.72, 0.8, 0.64, 0.84, 0.76, 0.68] : [0.55, 0.62, 0.47, 0.6, 0.52, 0.42];
    CHART_OFFSETS.forEach((off, i) => { t[`chart-${i + 1}`] = solve(Math.max(0.11, Math.min(A.C, 0.16)), (A.H + off) % 360, chartL[i], dark ? 1 : -1, 3.05, [t.surface]); });
    const sh = hexToRgb(oklch(dark ? 0.02 : 0.25, Math.min(cn * 3, 0.05), Hn)).map((v) => Math.round(v * 255));
    t["shadow-color"] = sh.join(" ");
    t["shadow-strength"] = dark ? "3" : "1";   // shadows need more weight to show on dark surfaces
    t.ring = dark ? "rgb(255 255 255 / 0.09)" : `rgb(${sh.join(" ")} / 0.08)`;          // 1px edge for cards and menus (decorative)
    t.highlight = dark ? "rgb(255 255 255 / 0.07)" : "rgb(255 255 255 / 0.18)";           // inner top edge on raised/solid controls
    return t;
  }

  const light = theme(false), dark = theme(true);

  // Verify every pair the tokens are meant for. Anything below target is reported loudly.
  const report = [];
  const check = (th, label, fg, bg, min) => { const r = contrast(th[fg] ?? fg, th[bg] ?? bg); report.push({ theme: label, pair: `${fg} on ${bg}`, ratio: +r.toFixed(2), min, ok: r >= min - 0.005 }); };
  for (const [label, th] of [["light", light], ["dark", dark]]) {
    for (const bg of ["bg", "surface", "surface-2"]) { check(th, label, "text", bg, 4.5); check(th, label, "text-muted", bg, 4.5); check(th, label, "text-subtle", bg, 4.5); check(th, label, "border-strong", bg, 3); }
    check(th, label, "accent-fg", "accent", 4.5); check(th, label, "accent-fg", "accent-hover", 4.5);
    check(th, label, "accent-text", "surface", 4.5); check(th, label, "accent-text", "accent-soft", 4.5); check(th, label, "focus", "surface", 3);
    if (secondary) { check(th, label, "secondary-fg", "secondary", 4.5); check(th, label, "secondary-text", "surface", 4.5); }
    for (const k of Object.keys(STATUS)) check(th, label, `${k}-text`, `${k}-soft`, 4.5);
    for (let i = 1; i <= 6; i++) check(th, label, `chart-${i}`, "surface", 3);
  }
  return { name, accent, light, dark, notes: [...new Set(notes)], report, neutral: { hue: Math.round(Hn), chroma: cn } };
}

function toCss(result, extra = "") {
  const block = (t, indent) => Object.entries(t).map(([k, v]) => `${indent}--${k}: ${v};`).join("\n");
  const head = `/* ${result.name}: generated by ui-craft palette.mjs from accent ${result.accent} (neutral hue ${result.neutral.hue}, chroma ${result.neutral.chroma}).\n   All text pairs pass WCAG 2.2 AA (4.5:1) on --bg, --surface and --surface-2; --border-strong, --focus and chart colours pass 3:1.\n   Load after tokens.css. Force a theme with <html data-theme="light|dark">. */`;
  return `${head}\n:root {\n  color-scheme: light;\n${block(result.light, "  ")}\n${extra}}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme="light"]) {\n    color-scheme: dark;\n${block(result.dark, "    ")}\n  }\n}\n:root[data-theme="dark"] {\n  color-scheme: dark;\n${block(result.dark, "  ")}\n}\n`;
}

      return `# Design brief: ${title()}\n\nUse the ui-craft skill and follow this brief for every screen. Live preview: ${shareUrl()}\n\n- **Direction:** ${d.name}. ${d.feeling}\n- **Made for:** ${d.for}\n- **Signature to build:** ${d.signature}\n- **Colour:** brand ${L.accent} on ${state.neutral === "pure" ? "pure grey" : state.neutral + "-tinted"} neutrals${state.secondary ? `, second colour ${hex(state.secondary).toUpperCase()}` : ""}. Default theme: ${state.theme}; ship both.\n- **Type:** headings in ${dm.fonts.display} (weight ${dm.weight}, letter-spacing ${dm.tracking}), text in ${dm.fonts.sans}, code and IDs in ${dm.fonts.mono}. Body ${dm.density.body}px.\n- **Shape and depth:** radius ${dm.radius.join("/")}px, ${dm.depth} depth, ${dm.borderW}px borders.\n- **Density:** controls ${dm.density.control}px, rows ${dm.density.row}px, sections ${dm.density.section}px apart. Controls grow to 44px on touch screens.\n- **Motion:** ${dm.motion} (${m.fast}/${m.base}/${m.slow}ms, press scale ${m.press}).\n- **Imagery:** ${d.imagery}\n- **Voice:** ${d.voice}\n- **Watch out:** ${d.watch}\n\n## Immersive and motion\n\n- **Intensity:** level ${dm.immersive} of 3, ${IMMERSIVE[dm.immersive].name}. ${IMMERSIVE[dm.immersive].rule}\n- **The direction's advice for 3D and scroll:** ${d.scene}\n- **Tempo:** ${dm.motion}. Interface motion ${m.fast}/${m.base}/${m.slow}ms. Scene, camera and scroll moves settle in about ${Math.round(m.slow * 2.2 / 50) * 50}ms with the same character (${m.ease}). ${dm.motion === "bouncy" ? "One overshoot is allowed on reward moments." : "No bounce."}\n- **Always:** the page reads and works with every effect switched off. Each effect has a reduced-motion version and a no-WebGL fallback. Text stays real HTML. The 3D engine loads after the first paint.\n- **How:** for any 3D, shader or scroll-driven work use the immersive-web skill (same plugin as ui-craft). It reads these tokens (\`--accent\`, \`--bg\`, \`--surface\`, \`--font-display\`, \`--dur-*\`, \`--ease-out\`, \`--immersive\`), so the scene follows this theme.\n\n## Rules\n\n1. Use only the tokens in theme.css (\`var(--surface)\`, \`var(--accent)\`, \`var(--radius)\`, \`var(--shadow-raised)\`…). Never hard-code a colour, radius or shadow.\n2. One primary action per screen. Show the screen in use, with real content.\n3. Check every screen at 390px and 1440px, in light and dark.\n\n## Fonts\n\n\`\`\`html\n${fontLink()}\n\`\`\`\n\n## Tokens\n\nExport **CSS** from the Studio link above and save it as theme.css.\n`; } },
};
let fmt = "css";
const dlg = $("#export");
$("#formats").innerHTML = Object.entries(FORMATS).map(([k, f]) => `<button type="button" role="tab" data-fmt="${k}">${f.label}</button>`).join("");
function showFormat(k) { fmt = k; $$("#formats button").forEach((b) => b.setAttribute("aria-selected", b.dataset.fmt === k)); $("#code").textContent = FORMATS[k].make(); $("#format-help").textContent = FORMATS[k].help; }
$("#formats").addEventListener("click", (e) => { const b = e.target.closest("[data-fmt]"); if (b) showFormat(b.dataset.fmt); });
$("#open-export").addEventListener("click", () => { showFormat(fmt); dlg.showModal(); });
$("#close-export").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
$("#copy").addEventListener("click", (e) => copyText($("#code").textContent, e.currentTarget));
$("#download").addEventListener("click", () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([$("#code").textContent], { type: "text/plain" })); a.download = FORMATS[fmt].file; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); });

addEventListener("hashchange", () => { readHash(); paint(); });
readHash();
current = build();
mountPreview();
syncControls();
window.__studio = { get state() { return state; }, get current() { return current; }, FORMATS };   // for tests
</script>
</body>
</html>
